[package]
name = "moduo"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "moduo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
bip39 = { version = "2", features = ["rand"] }
ed25519-dalek = "2"
chrono = { version = "0.4", features = ["serde"] }
fastrand = "2"
helix-rs = "0.1.10"
imap = "2.4.1"
keyring = { version = "3", features = ["apple-native"] }
lettre = "0.11.19"
mailparse = "0.16.1"
native-tls = "0.2.18"
ort = "2.0.0-rc.11"
rand = "0.8"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0", features = [] }
tokenizers = "0.22.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
webbrowser = "1"
