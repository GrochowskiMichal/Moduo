[package]
name = "moduo"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
default-run = "moduo"

[lib]
name = "moduo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Offline/"lite" build seed: compiles the redb↔Supabase cloud-sync worker
# (superseded by the JS `notesV2` engine on the default cloud build). Off by default.
lite = []

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
active-win-pos-rs = "0.8"
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
bip39 = { version = "2", features = ["rand"] }
ed25519-dalek = "2"
chrono = { version = "0.4", features = ["serde"] }
fastrand = "2"
imap = "2.4.1"
lettre = "0.11.19"
mailparse = "0.16.1"
native-tls = "0.2.18"
rand = "0.8"
redb = "2"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
webbrowser = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
