id: supabase-error-swallowed
language: typescript
severity: error
message: A Supabase failure is dropped or turned into empty data, so a failed read looks like "nothing there".
note: |
  Destructure `error` and throw it (or wrap the call in `runQuery`/`runRpc`), and keep
  "no row" and "the read failed" apart. Treating a failed read as empty is how prefs
  reconcile seeded defaults over real data (PR #509).
files:
  - apps/app/src/lib/**/*.ts
  - apps/app/src/lib/**/*.tsx
ignores:
  - "**/*.test.ts"
  - "**/*.test.tsx"
utils:
  # `await client.from(..)...` / `await client.rpc(..)` used directly, not through a
  # wrapper such as runQuery(..) that throws on `error`.
  awaited-supabase-call:
    kind: await_expression
    has:
      kind: call_expression
      all:
        - has:
            field: function
            kind: member_expression
        - has:
            stopBy: end
            kind: property_identifier
            regex: ^(from|rpc)$
  empty-value:
    any:
      - kind: "null"
      - kind: "undefined"
      - pattern: "[]"
      # `{}` as a value, never an empty `() => {}` body.
      - kind: object
        regex: ^\{\s*\}$
      - kind: parenthesized_expression
        regex: ^\(\s*\{\s*\}\s*\)$
      - pattern: new Map()
      - pattern: new Set()
      - pattern: '""'
rule:
  any:
    # The whole result is thrown away: `await sb.from("t").delete().eq(..)`.
    - kind: expression_statement
      has:
        matches: awaited-supabase-call
    # `const { data } = await sb.from(..)`: the result is read but `error` isn't.
    - kind: variable_declarator
      all:
        - has:
            field: name
            kind: object_pattern
            not:
              has:
                any:
                  - kind: shorthand_property_identifier_pattern
                    regex: ^error$
                  - kind: pair_pattern
                    has:
                      field: key
                      regex: ^error$
                  - kind: rest_pattern
        - has:
            field: value
            matches: awaited-supabase-call
    # `if (error) return []` / `if (error || !data) return null`: the failure becomes
    # empty data. A check on one specific `error.code` (an RPC not deployed yet) is a
    # deliberate fallback and isn't matched.
    - kind: if_statement
      all:
        - has:
            field: condition
            regex: ^\(\s*(\w+\.)?error\s*(\)|\|\|)
        - has:
            field: consequence
            any:
              - kind: return_statement
                has:
                  matches: empty-value
              - kind: statement_block
                has:
                  kind: return_statement
                  has:
                    matches: empty-value
