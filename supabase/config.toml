# Supabase Edge Functions configuration
# https://supabase.com/docs/guides/functions/config

# Disable gateway-level JWT verification for edge functions.
# Our functions perform their own JWT verification via requireUser()
# in _shared/auth.ts. This avoids the gateway rejecting valid ES256 JWTs
# due to key-id / algorithm mismatches at the Kong/Envoy layer.

[functions.email-connect-init]
verify_jwt = false

[functions.email-connect-callback]
verify_jwt = false

[functions.email-account-upsert-custom]
verify_jwt = false

[functions.email-sync-account]
verify_jwt = false

[functions.email-list-threads]
verify_jwt = false

[functions.email-get-thread]
verify_jwt = false

[functions.email-send]
verify_jwt = false

[functions.email-disconnect-account]
verify_jwt = false
