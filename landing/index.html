<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="mono" data-font="geist">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moduo</title>
    <meta
      name="description"
      content="Notes, tasks, calendar, email, and contacts — linked together, in one window."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <style>
      @font-face {
        font-family: Geist;
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/files/geist-sans-latin-400-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: Geist;
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/files/geist-sans-latin-500-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: Geist;
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/files/geist-sans-latin-600-normal.woff2")
          format("woff2");
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        color-scheme: dark;
        --background: oklch(0 0 0);
        --foreground: oklch(0.985 0 0);
        --muted-foreground: oklch(0.58 0 0);
        --border: oklch(0.22 0 0);
        --font-ui: Geist, Inter, system-ui, -apple-system, sans-serif;
        --motion-fade: 100ms;
        --ease-standard: cubic-bezier(0.2, 0, 0, 1);
      }

      html,
      body {
        height: 100%;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }

      body {
        min-height: 100dvh;
      }

      main {
        min-height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(2rem, 6vw, 5rem) clamp(1.5rem, 8vw, 8rem);
        animation: fade-in var(--motion-fade) var(--ease-standard) both;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
        }
      }

      .wordmark {
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: var(--foreground);
        margin-bottom: clamp(2.5rem, 6vh, 4.5rem);
      }

      h1 {
        font-size: clamp(2.25rem, 7.2vw, 5.5rem);
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.05;
        max-width: 18ch;
        text-wrap: balance;
      }

      .manifesto {
        margin-top: clamp(1.5rem, 3vh, 2.5rem);
        max-width: 36rem;
        font-size: clamp(1.0625rem, 1.6vw, 1.375rem);
        font-weight: 400;
        line-height: 1.5;
        color: var(--muted-foreground);
        text-wrap: pretty;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="wordmark">Moduo</p>
      <h1>One window for the whole working life.</h1>
      <p class="manifesto">
        Notes, tasks, calendar, email, and contacts — linked, so context never
        splits across five apps. You don’t build a system. You just work.
      </p>
    </main>
  </body>
</html>
