<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moduo</title>
    <meta name="description" content="Notes, tasks, calendar, email, and contacts — in one window." />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:         oklch(0.13 0.005 264);
        --surface:    oklch(0.17 0.006 264);
        --border:     oklch(0.24 0.007 264);
        --fg:         oklch(0.97 0.002 264);
        --muted:      oklch(0.55 0.005 264);
        --primary:    oklch(0.65 0.18 264);
        --radius-lg:  14px;
        --font:       system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      html, body {
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 2rem 1.25rem;
        gap: 0;
      }

      /* subtle radial glow behind the card */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse 60% 50% at 50% 30%, oklch(0.65 0.18 264 / 0.06) 0%, transparent 70%);
        pointer-events: none;
      }

      .card {
        position: relative;
        width: 100%;
        max-width: 440px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
        padding: 2.5rem 2rem;
        text-align: center;
      }

      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: var(--primary);
        margin-bottom: 1.5rem;
      }

      .mark svg {
        width: 26px;
        height: 26px;
        fill: #fff;
      }

      .wordmark {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: var(--fg);
        margin-bottom: 0.5rem;
      }

      .tagline {
        font-size: 0.9375rem;
        line-height: 1.55;
        color: var(--muted);
        margin-bottom: 2rem;
        max-width: 300px;
        margin-left: auto;
        margin-right: auto;
      }

      .divider {
        height: 1px;
        background: var(--border);
        margin-bottom: 1.75rem;
      }

      .status-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: oklch(0.74 0.16 145);
        flex-shrink: 0;
      }

      .status-label {
        font-size: 0.8125rem;
        color: var(--muted);
        letter-spacing: 0.02em;
      }

      .cta-link {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        padding: 0.625rem 1.25rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--fg);
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.15s, border-color 0.15s;
        cursor: pointer;
      }

      .cta-link:hover {
        background: oklch(0.22 0.007 264);
        border-color: oklch(0.32 0.008 264);
      }

      .footer {
        margin-top: 2rem;
        font-size: 0.75rem;
        color: oklch(0.38 0.005 264);
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Moduo mark — simple geometric M in a rounded square -->
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 20V6l10 8 10-8v14h-3V11.5l-7 5.6-7-5.6V20H3Z"/>
        </svg>
      </div>

      <h1 class="wordmark">Moduo</h1>
      <p class="tagline">Notes, tasks, calendar, email, and contacts — synced across web and desktop, in one window.</p>

      <div class="divider"></div>

      <div class="status-row">
        <span class="status-dot"></span>
        <span class="status-label">In private development</span>
      </div>

      <a class="cta-link" href="https://app.staging.moduo.app">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        </svg>
        Open staging app
      </a>
    </div>

    <p class="footer">© 2026 Moduo</p>
  </body>
</html>
