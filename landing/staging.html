<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moduo — staging</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        color-scheme: dark;
        --bg: oklch(0 0 0);
        --surface: oklch(0.14 0 0);
        --border: oklch(0.22 0 0);
        --fg: oklch(0.985 0 0);
        --muted: oklch(0.58 0 0);
        --radius-lg: 12px;
        --font: Geist, Inter, system-ui, -apple-system, sans-serif;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 2rem 1.25rem;
      }

      .card {
        width: 100%;
        max-width: 440px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
        padding: 2.5rem 2rem;
        text-align: center;
      }

      .wordmark {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.03em;
        margin-bottom: 0.5rem;
      }

      .tagline {
        font-size: 0.9375rem;
        line-height: 1.55;
        color: var(--muted);
        margin-bottom: 1.75rem;
      }

      .cta-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.625rem 1.25rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--fg);
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }

      .cta-link:hover {
        background: oklch(0.18 0 0);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="wordmark">Moduo</h1>
      <p class="tagline">Private staging access portal.</p>
      <a class="cta-link" href="https://app.staging.moduo.app">Open staging app</a>
    </div>
  </body>
</html>
