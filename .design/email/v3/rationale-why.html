<h2>The idea</h2>
<dl class="card-grid">
  <div class="k-card"><dt>Idea</dt><dd>Your inbox is a queue of decisions. Every thread says what it is to you, and one key turns it into work that stays linked to the person, the thread and your day.</dd></div>
  <div class="k-card"><dt>Core loop</dt><dd><span class="kbd">j</span> <span class="kbd">k</span> walk the tab and the reader follows. One key decides: <span class="kbd">e</span> Done · <span class="kbd">s</span> Snooze · <span class="kbd">t</span> Task · <span class="kbd">l</span> Link · <span class="kbd">n</span> Note · <span class="kbd">r</span> Reply. The next thread opens. <span class="kbd">[</span> <span class="kbd">]</span> to the next tab. Inbox zero, quietly.</dd></div>
  <div class="k-card"><dt>Signature: the state line</dt><dd>Under the subject, one line says where the thread stands, written by the keys: Waiting for Jonas's reply · reminds Thu · Task: Confirm the pilot week · Private note · Returns Fri 9:00 · Done Mon, in Archive. Each chip opens the thing. The row carries the same marks as small glyphs.</dd></div>
  <div class="k-card"><dt>Your day beside your mail</dt><dd>The Today column (shipped) holds the agenda and what's due. Drag a thread onto it to do it today; "Create event from this email" makes the meeting without leaving the thread.</dd></div>
  <div class="k-card"><dt>Motion verb</dt><dd>Advance. A decided thread leaves and the next one is open; the hint line under the list says what happened and which key undoes it; nothing animates on a key press.</dd></div>
  <div class="k-card"><dt>100th use</dt><dd>Three-line rows with a hairline between them; tabs that count only unread; nudges for follow-ups that came due at the top of Personal; a quiet hint line instead of toasts for triage.</dd></div>
</dl>
