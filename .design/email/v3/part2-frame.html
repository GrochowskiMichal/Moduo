  if (d.getFullYear() === NOW.getFullYear()) return `${d.getDate()} ${MON[d.getMonth()]}`;
  return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;
}

  const diff = d - NOW;
  if (diff > 0 && diff < 6 * DAY) return `${DOW[d.getDay()]} ${hm(d)}`;
  return `${d.getDate()} ${MON[d.getMonth()]}, ${hm(d)}`;
}
function fmtDay(iso) { const d = new Date(iso); if (sameDay(d, NOW)) return "today"; const diff = NOW - d; if (diff > 0 && diff < 6 * DAY) return DOW[d.getDay()]; return `${d.getDate()} ${MON[d.getMonth()]}`; }
