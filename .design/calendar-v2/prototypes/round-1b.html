.rrow { min-height: var(--row-h); display: flex; align-items: center; gap: 0.5rem; padding: 0 var(--panel-pad); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--foreground); width: 100%; }

.rrow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow .meta { margin-left: auto; font-size: var(--text-xs); color: var(--subtle-foreground); white-space: nowrap; }
.rrow .hov { margin-left: auto; opacity: 0; display: inline-flex; gap: 2px; color: var(--muted-foreground); }
.rrow:hover .hov, .rrow:focus-visible .hov { opacity: 1; }
.acct { display: flex; flex-direction: column; justify-content: center; min-height: var(--row-h-sm); padding: 0.25rem var(--panel-pad) 0; font-size: var(--text-xs); color: var(--muted-foreground); min-width: 0; }
.acct .al { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct .as { color: var(--subtle-foreground); font-size: var(--text-2xs); white-space: nowrap; }
.views { display: flex; flex-wrap: wrap; gap: 0.25rem; padding: var(--pad-y-sm) var(--panel-pad); }
.views .chip[aria-pressed="true"] { background: var(--state-active-hover); }
.views .chip[aria-pressed="true"]:hover { background: var(--state-active); }

/* ── Centre: toolbar, lines ──────────────────────────────────────────── */
.toolbar { flex-shrink: 0; height: calc(var(--bar-h) + 0.25rem); display: flex; align-items: center; gap: 0.25rem; padding: 0 var(--pad-x-sm); min-width: 0; }
.range { font-size: var(--text-md); font-weight: var(--font-weight-semibold); margin: 0 0.375rem; white-space: nowrap; flex-shrink: 0; }
.nownext { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 0.375rem; padding: 0 var(--pad-x-sm); height: var(--ctrl-h-sm); min-height: var(--hit-min); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--muted-foreground); overflow: hidden; white-space: nowrap; }
button.nownext:hover { background: var(--state-hover); }
.nownext b { color: var(--foreground); font-weight: var(--font-weight-medium); min-width: 4rem; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
.nownext .rest { min-width: 0; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1000; }
.livedot { width: 0.375rem; height: 0.375rem; border-radius: var(--radius-full); background: var(--primary); flex-shrink: 0; }
.status { display: inline-flex; align-items: center; gap: 0.375rem; flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: var(--text-xs); color: var(--subtle-foreground); white-space: nowrap; padding-left: 0.25rem; }
.status .ic.warn { color: var(--warning); }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.5rem; height: var(--ctrl-h-sm); padding: 0 var(--pad-x-sm); border-radius: var(--radius-md); background: var(--muted); box-shadow: inset 0 0 0 1px var(--ring); font-size: var(--text-sm); }
.line { flex-shrink: 0; display: flex; align-items: center; gap: 0.5rem; min-height: var(--row-h-sm); padding: 0 var(--pad-x-sm) 0 var(--pad-x); font-size: var(--text-sm); color: var(--muted-foreground); }
.line .btn { height: var(--ctrl-h-xs); font-size: var(--text-xs); }

/* ── Week grid ───────────────────────────────────────────────────────── */
.wk-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.heads { display: grid; flex-shrink: 0; }
.dh { padding: var(--pad-y-sm) 0.375rem; display: flex; flex-direction: column; gap: 2px; min-width: 0; border-bottom: 1px solid var(--hairline); }
.dh .wd { font-size: var(--text-2xs); color: var(--muted-foreground); letter-spacing: var(--tracking-wide); white-space: nowrap; }
.dh .dr { display: flex; align-items: center; gap: 0.375rem; height: 1.75rem; min-width: 0; }
.dh .dn { font-size: var(--text-xl); font-weight: var(--font-weight-medium); line-height: 1; height: 1.75rem; min-width: 1.75rem; display: inline-grid; place-items: center; border-radius: var(--radius-full); flex-shrink: 0; }
.dh.today .dn { background: var(--primary); color: var(--primary-foreground); }
.dh.past .dn { color: var(--muted-foreground); }
.due { min-height: var(--hit-min); padding: 0 0.375rem; border-radius: var(--radius-sm); border: 1px dashed var(--timeline-outline); font-size: var(--text-2xs); color: var(--muted-foreground); white-space: nowrap; }
.due:hover { background: var(--state-hover); color: var(--foreground); }
.allday { display: grid; flex-shrink: 0; border-bottom: 1px solid var(--hairline); padding: 2px 0; row-gap: 2px; }
.adlab { grid-column: 1; grid-row: 1 / -1; font-size: var(--text-2xs); color: var(--subtle-foreground); display: flex; align-items: center; justify-content: flex-end; padding-right: 0.5rem; }
.adbar, .duechip { min-height: var(--hit-min); display: flex; align-items: center; gap: 0.375rem; padding: 0 0.375rem; margin: 0 2px; border-radius: var(--radius-sm); font-size: var(--text-xs); white-space: nowrap; overflow: hidden; min-width: 0; }
.adbar { border-left: 2px solid var(--label); }
.adbar .nm, .duechip .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.adbar .len { color: var(--muted-foreground); font-size: var(--text-2xs); flex-shrink: 0; }
.duechip { background: var(--tag-chip-surface); }
.duechip:hover { background: var(--state-active); }
.duechip .cb { width: var(--icon-xs); height: var(--icon-xs); border-width: 1.25px; }
.more { min-height: var(--hit-min); min-width: var(--hit-min); font-size: var(--text-2xs); color: var(--muted-foreground); padding: 0 0.375rem; border-radius: var(--radius-sm); white-space: nowrap; }
.more:hover { background: var(--state-hover); color: var(--foreground); }
.gridscroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; }
.grid { display: grid; position: relative; }
.hours { position: relative; }
.hl { height: var(--cal-hour-h); font-size: var(--text-2xs); color: var(--subtle-foreground); text-align: right; padding-right: 0.5rem; transform: translateY(-0.4em); white-space: nowrap; }
.nowdot { position: absolute; right: -4px; width: 7px; height: 7px; margin-top: -3.5px; border-radius: var(--radius-full); background: var(--primary); z-index: 3; }
.nowlab { position: absolute; right: 0.5rem; margin-top: -0.5em; font-size: var(--text-2xs); color: var(--foreground); font-weight: var(--font-weight-medium); background: var(--card); z-index: 3; }
.col { position: relative; border-left: 1px solid var(--timeline-grid); background-image: repeating-linear-gradient(to bottom, var(--timeline-grid) 0 1px, transparent 1px var(--cal-hour-h)); }
.col.wkend { background-color: var(--timeline-weekend); }
.nowline { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px solid var(--primary); z-index: 1; pointer-events: none; }

/* Event chip: the house calendar chip (global.css .cal-chip) */
.ev { position: absolute; z-index: 2; border-radius: var(--radius-sm); border: 0 solid; border-left-width: 2px; padding: 2px 0.375rem; overflow: hidden; display: flex; flex-direction: column; gap: 1px; text-align: left; min-height: var(--hit-min); container-type: inline-size; transition: filter var(--motion-fast) var(--ease-out); }
.cal-chip { background-color: var(--background); background-image: linear-gradient(var(--label-surface), var(--label-surface)); border-color: var(--label); }
.cal-chip:hover { filter: brightness(1.12); }
.cal-chip[data-past] { background-image: linear-gradient(color-mix(in oklab, var(--label-surface) 55%, transparent), color-mix(in oklab, var(--label-surface) 55%, transparent)); border-color: transparent; }
.cal-chip[data-past] .tt { color: var(--muted-foreground); }
.ev .tt { font-size: var(--text-xs); color: var(--foreground); font-weight: var(--font-weight-medium); line-height: var(--leading-tight); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 1); text-overflow: ellipsis; min-width: 0; }
.ev .tm { font-size: var(--text-2xs); line-height: var(--leading-snug); color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: clip; }
.ev .pre { color: var(--muted-foreground); font-weight: var(--font-weight-regular); }
.ev .mk { display: inline-flex; vertical-align: -0.125em; margin-right: 0.25rem; gap: 2px; }
.ev .mk .ic { width: var(--icon-xs); height: var(--icon-xs); color: var(--muted-foreground); }
.ev .mk .ic.warn { color: var(--warning); }
.ev.one { flex-direction: row; align-items: center; gap: 0.375rem; padding-top: 0; padding-bottom: 0; }
.ev.one .tt { flex: 0 1 auto; display: block; white-space: nowrap; text-overflow: ellipsis; }
.ev.one .tm { flex-shrink: 0; }
.ap { display: inline; }
@container (max-width: 4.5rem) { .ev .ap { display: none; } }
@container (max-width: 5.5rem) { .ev.one .tm { display: none; } }
.tr-short { display: none; }
@container (max-width: 4rem) { .ev .tr-full { display: none; } .ev .tr-short { display: inline; } }
@container (max-width: 2.75rem) { .ev .tm { display: none; } }
.ev[data-selected] { box-shadow: 0 0 0 2px var(--state-selected-ring); z-index: 5; }
.ev:focus-visible { outline-offset: 1px; z-index: 6; }
.ev[data-kind="focus"] { background-color: var(--card); background-image: linear-gradient(var(--timeline-band), var(--timeline-band)); border: 1px solid var(--border); padding-left: 0.75rem; }
.ev[data-kind="focus"]::after { content: ""; position: absolute; left: 3px; top: 3px; bottom: 3px; width: 2px; border-radius: var(--radius-full); background: var(--timeline-outline); }
.ev[data-kind="focus"][data-selected]::after { background: var(--primary); }
.ev[data-kind="session"] { background: var(--card); border: 1px solid var(--timeline-outline); }
.ev[data-kind="session"]:hover { background: var(--muted); }
.ev[data-kind="session"] .row1 { display: flex; align-items: flex-start; gap: 0.25rem; min-width: 0; }
.ev[data-kind="session"] .cb { width: var(--icon-xs); height: var(--icon-xs); border-width: 1.25px; margin-top: 1px; }
.ev[data-kind="session"][data-past] .tt { color: var(--muted-foreground); }
.ev[data-missed] { border-style: dashed; }
.ev[data-missed] .tt { color: var(--muted-foreground); }
.ev[data-kind="hold"] { background: var(--card); border: 1px dashed var(--label); }
.ev[data-kind="draft"] { background: var(--card); background-image: linear-gradient(var(--state-selected), var(--state-selected)); border: 1px dashed var(--ring); }
.ev[data-kind="invite"] { background: var(--card); border: 1px dashed var(--label); border-left: 2px solid var(--label); }
.ntick { position: absolute; left: 0; width: 0.375rem; height: 0; border-top: 1.5px solid var(--primary); pointer-events: none; }
.foldn { position: absolute; z-index: 3; display: grid; place-items: center; border-radius: var(--radius-sm); background: var(--muted); font-size: var(--text-2xs); color: var(--foreground); font-weight: var(--font-weight-medium); min-height: var(--hit-min); }
.foldn:hover { background: var(--state-active-hover); }
.skel { position: absolute; left: 4px; right: 6px; border-radius: var(--radius-sm); background: var(--muted); }
.skel-t { height: 0.625rem; border-radius: var(--radius-sm); background: var(--muted); }
.pop { position: absolute; z-index: 8; width: 16rem; padding: var(--pad-y-sm); border-radius: var(--radius-lg); background: var(--popover); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 2px; font-size: var(--text-sm); }
.pop .hd { padding: 0.25rem var(--pad-y-sm) 0.375rem; display: flex; flex-direction: column; gap: 1px; }
.pop .act { min-height: var(--row-h-sm); display: flex; align-items: center; gap: 0.5rem; padding: 0 var(--pad-y-sm); border-radius: var(--radius-md); color: var(--foreground); width: 100%; }
.pop .act:hover { background: var(--state-hover); }
.pop .act .kbd { margin-left: auto; }
.pop .act .s { margin-left: auto; font-size: var(--text-xs); color: var(--muted-foreground); }
.card-empty { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); z-index: 6; width: min(26rem, 90%); padding: var(--pad-x); border-radius: var(--radius-lg); background: var(--popover); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: var(--pad-y-sm); }
.card-empty h3 { font-size: var(--text-md); font-weight: var(--font-weight-semibold); }
.typed { padding: var(--pad-y-sm) var(--pad-x-sm); border-radius: var(--radius-md); background: var(--muted); font-size: var(--text-sm); color: var(--muted-foreground); line-height: var(--leading-normal); }
.typed b { color: var(--foreground); font-weight: var(--font-weight-medium); }

/* Month */
.month { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.mhead { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); flex-shrink: 0; border-bottom: 1px solid var(--hairline); }
.mhead span { font-size: var(--text-2xs); color: var(--muted-foreground); letter-spacing: var(--tracking-wide); padding: 0.375rem 0.5rem; }
.mweeks { flex: 1; min-height: 0; display: grid; grid-template-rows: repeat(6, minmax(0, 1fr)); }
.mwk { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: 1.75rem repeat(2, var(--hit-min)) var(--hit-min) minmax(0, 1fr); row-gap: 1px; border-bottom: 1px solid var(--timeline-grid); overflow: hidden; }
.mcell { grid-row: 1 / -1; border-left: 1px solid var(--timeline-grid); }
.mcell.past { background: var(--timeline-weekend); }
.mdate { grid-row: 1; display: flex; align-items: center; gap: 0.375rem; padding: 0 0.375rem; font-size: var(--text-xs); min-width: 0; z-index: 1; }
.mdate .n { min-width: 1.5rem; height: 1.5rem; display: inline-grid; place-items: center; border-radius: var(--radius-full); }
.mdate.out .n { color: var(--subtle-foreground); }
.mdate.past .n { color: var(--muted-foreground); }
.mdate.today .n { background: var(--primary); color: var(--primary-foreground); font-weight: var(--font-weight-semibold); }
.mi { z-index: 1; min-width: 0; margin: 0 2px; display: flex; align-items: center; gap: 0.375rem; padding: 0 0.375rem; border-radius: var(--radius-sm); font-size: var(--text-xs); white-space: nowrap; overflow: hidden; }
.mi:hover { background: var(--state-hover); }
.mi .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mi .w { color: var(--muted-foreground); font-size: var(--text-2xs); flex-shrink: 0; }
.mi.past .nm { color: var(--muted-foreground); }
.mi.bar { border-left: 2px solid var(--label); background-image: linear-gradient(var(--label-surface), var(--label-surface)); }
.mi.bar.past { background-image: linear-gradient(color-mix(in oklab, var(--label-surface) 55%, transparent), color-mix(in oklab, var(--label-surface) 55%, transparent)); border-color: transparent; }
.mi.duec { background: var(--tag-chip-surface); }
.mi .cb { width: var(--icon-xs); height: var(--icon-xs); border-width: 1.25px; }

/* List view */
.list { flex: 1; min-height: 0; overflow: auto; padding: 0 var(--pad-x-sm) var(--pad-x); }
.lgroup { display: flex; flex-direction: column; }
.lgh { position: sticky; top: 0; z-index: 2; background: var(--card); height: var(--row-h); display: flex; align-items: center; gap: 0.5rem; padding: 0 var(--panel-pad); font-size: var(--text-sm); font-weight: var(--font-weight-medium); border-bottom: 1px solid var(--hairline); }
.lgh .t2 { font-weight: var(--font-weight-regular); font-size: var(--text-xs); }
.lrow { min-height: var(--row-h); display: grid; grid-template-columns: var(--when-w, 9rem) minmax(0, 1fr) auto; align-items: center; gap: var(--pad-x-sm); padding: 0.25rem var(--panel-pad); border-radius: var(--radius-md); font-size: var(--text-sm); width: 100%; }
.lrow:hover { background: var(--state-hover); }
.lrow[data-selected] { background: var(--state-selected); }
.lrow .lt { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
.lrow .lt .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .when { color: var(--muted-foreground); font-size: var(--text-xs); display: flex; flex-direction: column; }
.lrow .when span { white-space: nowrap; }
.lrow .meta { color: var(--subtle-foreground); font-size: var(--text-xs); white-space: nowrap; }
mark { background: var(--state-selected-ring); color: var(--foreground); border-radius: var(--radius-sm); }

/* ── Right panel ─────────────────────────────────────────────────────── */
.rp-title { flex-shrink: 0; height: calc(var(--panel-pad) * 2 + var(--row-h)); display: flex; align-items: center; gap: 0.25rem; padding: 0 var(--panel-pad); }
.rp-sw { height: var(--row-h-sm); display: inline-flex; align-items: center; gap: 0.375rem; padding: 0 var(--pad-y); border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--font-weight-medium); }
.rp-sw:hover { background: var(--state-hover); }
.back { height: var(--row-h-sm); display: inline-flex; align-items: center; gap: 0.25rem; padding: 0 var(--pad-y); border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--muted-foreground); max-width: 60%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.back:hover { background: var(--state-hover); color: var(--foreground); }
.rp-body { flex: 1; min-height: 0; overflow: auto; padding: 0 var(--panel-pad) var(--pad-x); display: flex; flex-direction: column; gap: var(--pad-y); }
.dd { position: absolute; z-index: 9; top: calc(var(--panel-pad) + var(--row-h)); left: var(--panel-pad); min-width: 12rem; padding: 0.25rem; border-radius: var(--radius-lg); background: var(--popover); box-shadow: var(--shadow-lg); }
.dd button { height: var(--row-h-sm); width: 100%; display: flex; align-items: center; gap: 0.5rem; padding: 0 var(--pad-y); border-radius: var(--radius-md); font-size: var(--text-sm); }
.dd button:hover { background: var(--state-hover); }
.dd .kbd { margin-left: auto; }
.grp { display: flex; flex-direction: column; }
.grp-h { height: var(--row-h-sm); display: flex; align-items: center; gap: 0.375rem; padding: 0 var(--panel-pad); font-size: var(--text-xs); font-weight: var(--font-weight-medium); color: var(--muted-foreground); }
.grp-h .n { color: var(--subtle-foreground); font-weight: var(--font-weight-regular); }
.trow { min-height: var(--row-h); display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem var(--panel-pad); border-radius: var(--radius-md); font-size: var(--text-sm); width: 100%; }
.trow:hover { background: var(--state-hover); }
.trow .tx { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.trow .tx .s { font-size: var(--text-xs); color: var(--muted-foreground); }
.trow .rmeta { font-size: var(--text-xs); color: var(--subtle-foreground); white-space: nowrap; }
.trow.nofit .tx .s { color: var(--foreground); }
.dtitle { font-size: var(--text-lg); font-weight: var(--font-weight-semibold); line-height: var(--leading-tight); padding: 0 var(--panel-pad); }
.dsub { padding: 0 var(--panel-pad); font-size: var(--text-sm); color: var(--muted-foreground); }
.props { display: flex; flex-direction: column; }
.prop { min-height: var(--row-h); display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); align-items: start; gap: 0.5rem; padding: 0.5rem var(--panel-pad); border-radius: var(--radius-md); font-size: var(--text-sm); }
.prop:hover { background: var(--state-hover); }
.prop .k { color: var(--muted-foreground); }
.prop .v { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.prop .v .s { font-size: var(--text-xs); color: var(--muted-foreground); }
.rsvp { display: flex; gap: 2px; padding: 2px; border-radius: var(--radius-md); background: var(--muted); }
.rsvp button { flex: 1; min-height: var(--hit-min); height: var(--ctrl-h-sm); border-radius: var(--radius-sm); font-size: var(--text-sm); font-weight: var(--font-weight-medium); color: var(--muted-foreground); text-align: center; }
.rsvp button:hover { background: var(--state-hover); color: var(--foreground); }
.person { display: flex; align-items: center; gap: 0.5rem; min-height: var(--row-h-sm); }
.person .r { margin-left: auto; font-size: var(--text-xs); color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 0.25rem; white-space: nowrap; }
.sect { display: flex; flex-direction: column; gap: 2px; }
.sect-h { height: var(--row-h-sm); display: flex; align-items: center; gap: 0.375rem; padding: 0 var(--panel-pad); font-size: var(--text-xs); color: var(--muted-foreground); font-weight: var(--font-weight-medium); }
.sect-h .btn { margin-left: auto; }
.ref { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.5rem var(--panel-pad); border-radius: var(--radius-md); font-size: var(--text-sm); width: 100%; }
.ref:hover { background: var(--state-hover); }
.ref .ic { margin-top: 0.25rem; color: var(--muted-foreground); }
.ref .rx { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.ref .rx .s { font-size: var(--text-xs); color: var(--muted-foreground); }
.actrow { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem; padding: 0 var(--panel-pad); }
.actgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem; padding: 0 var(--panel-pad); }
.actgrid .btn { justify-content: flex-start; white-space: normal; height: auto; min-height: var(--ctrl-h); padding-block: 0.375rem; line-height: var(--leading-tight); }
.note-box { margin: 0 var(--panel-pad); padding: var(--pad-y-sm) var(--pad-x-sm); border-radius: var(--radius-md); background: var(--muted); font-size: var(--text-sm); color: var(--muted-foreground); display: flex; gap: 0.5rem; align-items: flex-start; }
.note-box .ic { margin-top: 0.1875rem; }
.statusline { margin: 0 var(--panel-pad); padding: var(--pad-y-sm) var(--pad-x-sm); border-radius: var(--radius-md); background: var(--state-selected); font-size: var(--text-sm); display: flex; flex-direction: column; gap: 2px; }
.statusline .s { font-size: var(--text-xs); color: var(--muted-foreground); }

function lines(c) {

  for (const d in hidden) h += `<div style="grid-row:3;grid-column:${idx(+d)}"><button class="more num">+${hidden[d]} more</button></div>`;

let COLS = "";

  const dueN = (d) => (c.hard === "empty" || c.hard === "loading" ? 0 : (DUE[d] || []).length);
  const nowY = `calc(var(--cal-hour-h) * ${(NOW - H0).toFixed(3)})`;
  const showNow = c.hard !== "empty" && c.hard !== "loading";
  const heads = days.map((d) => `<div class="dh ${d === TODAY ? "today" : d < TODAY ? "past" : ""}"><span class="wd">${DAYS[d]}</span><span class="dr"><span class="dn num">${DATES[d]}</span>${dueN(d) ? `<button class="due num">${dueN(d)} due</button>` : ""}</span></div>`).join("");
  const hours = []; for (let h = H0; h < H1; h++) hours.push(`<div class="hl num">${h === H0 || (showNow && Math.abs(h - NOW) < 0.34) ? "" : tm(h).replace(":00", "")}</div>`);
  const colsHtml = days.map((d) => {
    const px = dayPx(c, w, d);
    const maxCols = Math.max(1, Math.min(2, Math.floor((px + 6) / 54)));
    const { items, folds } = layoutDay(ev.filter((e) => e.d === d), maxCols);
    const chips = items.filter((e) => !e.hidden).map((e) => chip(e, c, px / e.ncol)).join("");
    const foldHtml = folds.map((f) => { const fw = 100 / f.ncol; const pos = f.badge ? "right:4px;width:var(--hit-min)" : `left:calc(${(f.col * fw).toFixed(2)}% + 2px);width:calc(${fw.toFixed(2)}% - 4px)`; return `<button class="foldn num" data-fold="${f.ids.join(",")}" style="top:calc(var(--cal-hour-h) * ${(f.s - H0).toFixed(3)} + 2px);${pos};height:var(--hit-min)">+${f.n}<span class="sr"> more events</span></button>`; }).join("");
    const now = d === TODAY && showNow ? `<div class="nowline" style="top:${nowY}" aria-hidden="true"></div>` : "";
    const skel = c.hard === "loading" ? BASE.filter((e) => e.d === d).map((e) => `<div class="skel" style="top:calc(var(--cal-hour-h) * ${e.s - H0} + 1px);height:calc(var(--cal-hour-h) * ${e.e - e.s} - 2px)"></div>`).join("") : "";
    return `<div class="col ${d > 4 ? "wkend" : ""}" style="height:calc(var(--cal-hour-h) * ${H1 - H0})">${skel}${chips}${foldHtml}${now}</div>`;
  }).join("");
  const gutterNow = showNow ? `<div class="nowlab num" style="top:${nowY}">${short(NOW)}</div><div class="nowdot" style="top:${nowY}" aria-hidden="true"></div>` : "";
  let overlay = "";
  if (c.hard === "empty") overlay = `<div class="card-empty" role="dialog" aria-label="Your week is open"><h3>Your week is open</h3><div class="t2">Press N and type what and when. The draft lands on the grid at the first free time.</div><div class="typed"><b>Lunch with Priya</b> <b>thu 1pm</b> → Thu · Nov 26 · 1:00–2:00 PM</div><div class="actrow" style="padding:0"><button class="btn primary">New event <span class="kbd">N</span></button><button class="btn secondary">Connect a calendar</button><span class="grow"></span><button class="btn">Close</button></div></div>`;

  if (S.pop) overlay += `<div class="pop" role="dialog" aria-label="More events" style="right:1rem;top:calc(var(--cal-hour-h) * 2)"><div class="hd"><b>${S.pop.length} more at this time</b></div>${S.pop.map((id) => { const e = ev.find((x) => x.id === id); return e ? `<button class="act" data-id="${e.id}"><span class="dot" data-label="${CALS[e.cal].hue}" aria-hidden="true"></span><span>${esc(e.t)}</span><span class="s num">${span(e.s, e.e)}</span></button>` : ""; }).join("")}</div>`;
  return `<div class="wk-wrap"><div class="heads" style="grid-template-columns:${COLS}"><div class="dh" aria-hidden="true"><span class="wd">&nbsp;</span><span class="dr"><span class="t3" style="font-size:var(--text-2xs)">CET</span></span></div>${heads}</div>

const FULLDAY = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const spoken = (h) => tm(h).replace(":00", "");
const GENERIC = /^(Call|Sync|Check-in|Interview|Review|Crit|Pairing|Handoff) with /;
function chip(e, c, lanePx) {
  const nudge = e.nudge || 0;
  const top = `calc(var(--cal-hour-h) * ${(e.s - H0).toFixed(3)} + ${1 + nudge}px)`;
  const h = `calc(var(--cal-hour-h) * ${(e.e - e.s).toFixed(3)} - ${2 + nudge}px)`;
  const w = 100 / e.ncol;
  const left = `calc(${(e.col * w).toFixed(2)}% + 2px)`;
  const width = `calc(${w.toFixed(2)}% - ${e.ncol > 1 ? 3 : 6}px)`;
  const hpx = (e.e - e.s) * HOURPX() - 2 - nudge;
  const avail = Math.max(1, Math.floor((hpx - 4) / 14.5));
  const narrow = lanePx < 70;
  const one = avail <= 1;
  const past = isPast(e);
  const sel = S.sel === e.id;
  const hue = CALS[e.cal] ? CALS[e.cal].hue : "gray";
  const session = e.kind === "session";
  const kind = session ? "session" : e.invite ? "invite" : e.kind || "event";
  // The state word (Missed, Draft, Held, Reply?) rides on the time line; the title line is the name.
  const state = e.missed ? "Missed" : kind === "draft" ? "Draft" : kind === "hold" ? "Held" : kind === "invite" ? "Reply?" : "";
  const mk = [e.waiting ? ic("cloudoff") : "", e.saving ? ic("refresh") : ""].join("");
  const plain = e.kind !== "focus" && !session && kind !== "draft" && kind !== "hold" && kind !== "invite";
  const sessLine = session && c.sessions && e.sn ? `Session ${e.sn}` : "";
  const focusTitle = e.kind === "focus" ? (e.proj ? e.t : e.holds ? e.holds : "Open focus time") : null;
  let title = focusTitle || e.t;
  if (lanePx < 90 && GENERIC.test(title)) title = title.replace(GENERIC, "");
  const calName = CALS[e.cal] ? CALS[e.cal].name : "";
  const name = `${focusTitle ? `Focus time, ${focusTitle}` : e.t}, ${FULLDAY[e.d]} ${spoken(e.s)} to ${spoken(e.e)}, ${calName}${sessLine ? `, session ${e.sn}` : ""}${state ? `, ${state === "Reply?" ? "invitation, no reply yet" : state.toLowerCase()}` : ""}${e.stale ? ", not updated since 9:12 AM" : ""}${e.waiting ? ", waiting to sync" : ""}${e.d === TODAY && e.s < NOW && e.e > NOW ? ", happening now" : ""}`;
  const attrs = `class="ev ${plain ? "cal-chip" : ""} ${one ? "one" : ""} ${narrow ? "narrow" : ""}" data-id="${e.id}" data-label="${hue}" ${past ? "data-past" : ""} ${sel ? "data-selected" : ""} ${e.missed ? "data-missed" : ""} ${e.stale ? "data-stale" : ""} data-kind="${kind}" style="top:${top};height:${h};left:${left};width:${width}"`;
  const mkHtml = mk ? `<span class="mk">${mk}</span>` : "";
  let inner;
  if (narrow) {
    inner = `<span class="tt" style="--lines:${Math.max(1, Math.min(4, avail))}">${esc(title)}</span>`;
  } else if (one) {
    const t1 = e.kind === "focus" ? `<span class="pre">Focus · </span>${esc(title)}` : `${mkHtml}${esc(title)}`;
    inner = `${session ? `<span class="cb"></span>` : ""}<span class="tt">${t1}</span><span class="tm num">${state ? `<span class="st">${state}</span>` : cstart(e.s)}</span>`;
  } else {
    let left2 = avail;
    const extra = [];
    if (e.kind === "focus") { extra.push(`<span class="tm">${ic("focus", "xs")} Focus time</span>`); left2--; }
    let useSess = false, useTime = false;
    if (sessLine && left2 >= 2) { useSess = true; left2--; }
    if (left2 >= 2) { useTime = true; left2--; }
    const lines = Math.max(1, Math.min(3, left2));
    const tt = `<span class="tt" style="--lines:${lines}">${mkHtml}${esc(title)}</span>`;
    const timeL = useTime ? `<span class="tm num">${state ? `<span class="st">${state}</span> · ${cstart(e.s)}` : cspan(e.s, e.e)}${e.booked && avail >= 4 ? " · via " + e.booked : ""}</span>` : state ? `<span class="tm"><span class="st">${state}</span></span>` : "";
    const sessL = useSess ? `<span class="tm">${sessLine}</span>` : "";
    inner = session ? `<span class="row1"><span class="cb"></span>${tt}</span>${timeL}${sessL}` : `${extra.join("")}${tt}${timeL}`;
  }
  let tick = "";
  if (e.d === TODAY && e.s < NOW && e.e > NOW && c.hard !== "loading") tick = `<span class="ntick" style="top:${(((NOW - e.s) / (e.e - e.s)) * 100).toFixed(1)}%"></span>`;
  const stdot = e.stale ? `<span class="stdot"></span>` : "";
  return `<button ${attrs}><span class="evin">${stdot}${inner}${tick}</span><span class="sr">, ${esc(name.slice(name.indexOf(", ") + 2))}</span></button>`;
}

/* ── Month (C24 option a) ─────────────────────────────────────────── */
const mtime = (s) => { const p = parts(s); return p.mm ? short(s) : `${p.h12} ${p.ap}`; };
function monthView(c) {
  const T = 31;
  const dayNum = (i) => (i < 6 ? 26 + i : i - 5 <= 30 ? i - 5 : i - 35);
  const inMonth = (i) => i >= 6 && i - 5 <= 30;
  const bars = [{ a: 16, b: 17, t: "Studio offsite", cal: "work" }, { a: 28, b: 29, t: "Jonas off", cal: "work" }, { a: 31, b: 31, t: "Thanksgiving (US)", cal: "hol" }, { a: 32, b: 34, t: "Studio retreat prep", cal: "work" }, { a: 40, b: 41, t: "Weekend in Bergen", cal: "personal" }];
  const due = []; for (const d in DUE) DUE[d].forEach((t) => due.push({ i: 28 + +d, t })); due.push({ i: 36, t: "Draft Q1 hiring plan" }, { i: 23, t: "Send Halden invoice #14" });
  const timed = [];
  for (const e of BASE) if (e.kind !== "session" && e.kind !== "focus" && !e.rep) timed.push({ i: 28 + e.d, s: e.s, t: e.t, cal: e.cal });
  [[8, 14, "Halden pitch", "clients"], [10, 11, "Oslo discovery call", "clients"], [12, 15.5, "Dentist", "personal"], [21, 10, "Halden: logo round 2", "clients"], [23, 16, "Board call", "work"], [24, 13, "Lunch with Mara", "personal"], [35, 11, "Halden: final files", "clients"], [37, 14, "Oslo proposal: send", "clients"], [38, 10, "Nordlys launch", "clients"], [3, 15, "Studio show and tell", "work"]].forEach(([i, s, t, cal]) => timed.push({ i, s, t, cal }));
  for (let i = 0; i < 42; i++) if (i % 7 < 5) timed.push({ i, s: 9.5, t: "Standup", cal: "work" });
  let weeks = "";
  for (let wk = 0; wk < 6; wk++) {
    const i0 = wk * 7, i1 = i0 + 6;
    const slots = Array.from({ length: 7 }, () => [0, 0]);
    let items = "";
    const hidden = Array(7).fill(0);
    const place = (a, b, html) => {
      for (let r = 0; r < 2; r++) { let ok = true; for (let d = a; d <= b; d++) if (slots[d][r]) ok = false; if (ok) { for (let d = a; d <= b; d++) slots[d][r] = 1; items += `<div class="adslot" style="grid-row:${r + 2};grid-column:${a + 1} / ${b + 2}">${html}</div>`; return; } }
      for (let d = a; d <= b; d++) hidden[d]++;
    };
    for (const br of bars) { const a = Math.max(br.a, i0), b = Math.min(br.b, i1); if (b < a) continue; place(a - i0, b - i0, `<button class="mi bar ${br.b < T ? "past" : ""} ${inMonth(br.a) ? "" : "out"}" data-label="${CALS[br.cal].hue}"><span class="nm">${esc(br.t)}</span>${br.b > br.a && a === Math.max(br.a, i0) ? `<span class="w">${br.b - br.a + 1} days</span>` : ""}</button>`); }
    for (const du of due.filter((x) => x.i >= i0 && x.i <= i1)) place(du.i - i0, du.i - i0, `<button class="mi duec ${du.i < T ? "past" : ""} ${inMonth(du.i) ? "" : "out"}"><span class="cb" aria-hidden="true"></span><span class="nm">${esc(du.t)}</span><span class="sr">, due</span></button>`);
    for (const t of timed.filter((x) => x.i >= i0 && x.i <= i1).sort((a, b) => a.s - b.s)) place(t.i - i0, t.i - i0, `<button class="mi ${t.i < T ? "past" : ""} ${inMonth(t.i) ? "" : "out"}" data-label="${CALS[t.cal].hue}"><span class="dot" aria-hidden="true"></span><span class="w num">${mtime(t.s)}</span><span class="nm">${esc(t.t)}</span></button>`);
    let cells = "", dates = "", more = "";
    for (let d = 0; d < 7; d++) {
      const i = i0 + d;
      cells += `<div class="mcell ${i < T || !inMonth(i) ? "past" : ""}" style="grid-column:${d + 1}"></div>`;
      const dueCount = due.filter((x) => x.i === i).length;
      dates += `<div class="mdate ${inMonth(i) ? "" : "out"} ${i < T ? "past" : ""} ${i === T ? "today" : ""}" style="grid-column:${d + 1}"><span class="n num">${dayNum(i)}</span>${dueCount && i >= T ? `<button class="due num">${dueCount} due</button>` : ""}</div>`;
      if (hidden[d]) more += `<div style="grid-row:4;grid-column:${d + 1};padding-left:2px"><button class="more num">+${hidden[d]} more</button></div>`;

/* ── List and search (C5) ─────────────────────────────────────────── */
let SEARCH_COUNT = 0;
function listView(c, search) {
  const ev = events(c).filter((e) => e.kind !== "draft");
  const hl = (t) => search ? esc(t).replace(/halden/gi, (m) => `<mark>${m}</mark>`) : esc(t);
  const calName = (k) => (CALS[k] ? CALS[k].name : "");
  const fromEv = (e, whenFirst) => ({ t: e.t, when: whenFirst ? [whenFirst, span(e.s, e.e)] : [span(e.s, e.e)], cal: e.cal, id: e.id, kind: e.kind === "session" ? "session" : e.kind === "focus" ? "focus" : "event", invite: e.invite, past: isPast(e), s: e.s, d: e.d });
  let groups = [];
  if (search) {
    const past = [{ t: "Halden discovery workshop", when: ["Wed · Sep 30", "10:00 AM–12:30 PM"], cal: "clients", kind: "event", past: 1 }, { t: "Halden: logo round 1", when: ["Wed · Oct 14", "2:00–3:00 PM"], cal: "clients", kind: "event", past: 1 }];
    const now = ev.filter((e) => /halden/i.test(e.t)).sort((a, b) => a.d - b.d || a.s - b.s).map((e) => fromEv(e, dayLabel(e.d)));
    const later = [{ t: "Halden moodboard", when: ["Mon · Nov 30", "10:00 AM–12:00 PM"], cal: "you", kind: "session" }, { t: "Halden: final files", when: ["Mon · Nov 30", "11:00 AM–12:00 PM"], cal: "clients", kind: "event" }];
    const dues = [{ t: "Send Halden contract redlines", when: ["Mon · Nov 23", "Due"], cal: "you", kind: "due" }, { t: "Halden invoice", when: ["Fri · Nov 27", "Due"], cal: "you", kind: "due" }];
    groups = [["Earlier", past], ["This week", now], ["Later", later], ["Due", dues]];
    SEARCH_COUNT = past.length + now.length + later.length + dues.length;
  } else {
    for (let d = TODAY; d <= 6; d++) {
      const rows = ev.filter((e) => e.d === d).sort((a, b) => a.s - b.s).map((e) => fromEv(e));
      const due = (DUE[d] || []).map((t) => ({ t, when: ["Due"], cal: "you", kind: "due" }));
      const ad = ALLDAY.filter((a) => d >= a.d0 && d <= a.d1).map((a) => ({ t: a.t, when: ["All day"], cal: a.cal, kind: "event" }));
      groups.push([d === TODAY ? "Today · Thu · Nov 26" : d === TODAY + 1 ? "Tomorrow · Fri · Nov 27" : `${DAYS[d]} · Nov ${DATES[d]}`, ad.concat(due, rows), d === TODAY]);

  }
  const glyph = (r) => r.kind === "due" ? ic("task") : r.kind === "session" ? `<span class="cb" aria-hidden="true"></span>` : r.kind === "focus" ? ic("focus") : `<span class="dot" aria-hidden="true"></span>`;
  const kindWord = (r) => r.kind === "due" ? ", task due" : r.kind === "session" ? ", work session" : r.kind === "focus" ? ", focus time" : "";
  const row = (r) => `<button class="lrow ${r.past ? "ended" : ""}" data-label="${CALS[r.cal] ? CALS[r.cal].hue : "gray"}" ${r.id ? `data-id="${r.id}"` : ""} ${r.id && S.sel === r.id ? "data-selected" : ""}><span class="when num">${r.when.map((x) => `<span>${x}</span>`).join("")}</span><span class="lt">${glyph(r)}<span class="nm">${hl(r.t)}</span>${r.invite ? `<span class="t2 rq">Reply?</span>` : ""}<span class="sr">${kindWord(r)}</span></span><span class="meta">${esc(calName(r.cal))}</span></button>`;

function reviewRows(c) {

const ALLCALLS = GROUPS.flatMap((g) => g.calls);

function callsPanel() {
  const el = document.getElementById("calls");
  if (!el || S.critic) return;

  if (keep) CS.scroll = keep.scrollTop;
  el.hidden = CS.hidden;
  document.getElementById("callsToggle").setAttribute("aria-pressed", String(!CS.hidden));
  if (CS.hidden) return;
  const open = CS.open || `f${S.f}`;
  const done = ALLCALLS.filter(answered).length;
  const saved = CS.store === "db" ? "Saved as you go; Claude reads them directly." : CS.store === "local" ? "Saved in this browser only: use Copy answers and paste them in chat." : "";
  let h = `<div class="calls-head"><div class="calls-title"><b>Calls</b><span class="t3 num">${done} of ${ALLCALLS.length} answered</span><span class="grow"></span><button class="cbtn" data-cact="copy">${CS.copied ? "Copied" : "Copy answers"}</button><button class="cbtn" data-cact="hide" aria-label="Hide the calls panel">Hide</button></div><p class="t3">Each frame's calls sit under it. Pick an option; <b>See</b> switches the picture to the variant that shows it. ${saved}</p></div><div class="calls-body">`;
  for (const g of GROUPS) {
    const isOpen = g.id === open;
    const n = g.calls.filter(answered).length;
    h += `<section class="cgroup${isOpen ? " open" : ""}"><button class="cg-head" data-cgroup="${g.id}" aria-expanded="${isOpen}"><span class="cg-name">${g.f ? `<span class="kbd">${g.f}</span>${cesc(FR[g.f].n)}` : cesc(g.n)}</span><span class="t3 num">${g.calls.map((c) => c.id).join(" · ")}</span><span class="cg-count num${n === g.calls.length ? " full" : ""}">${n}/${g.calls.length}</span></button>`;
    if (isOpen) {
      if (g.sub) h += `<p class="t3 cg-sub">${cesc(g.sub)}</p>`;
      for (const c of g.calls) {
        const a = ANS[c.id] || { picks: {}, note: "" };
        h += `<article class="call${answered(c) ? " done" : ""}" id="call-${c.id}"><h3>${c.star ? "★ " : ""}${c.id} · ${cesc(c.t)}</h3>`;
        for (const p of c.parts) {
          h += `<p class="cq">${cesc(p.q)}</p><div class="copts" role="radiogroup" aria-label="${c.id}${c.parts.length > 1 ? " " + p.k : ""}">`;
          for (const o of p.opts) {
            const on = a.picks && a.picks[p.k] === o.k;
            const sv = o.see ? parseSee(o.see) : null;
            const here = sv && sv.f === S.f && sv.v === S.v;
            h += `<div class="copt"><button role="radio" aria-checked="${on}" class="cpick" data-cpick="${c.id}|${p.k}|${o.k}"><span class="rdot" aria-hidden="true"></span><span>${cesc(o.l)}${o.k === p.rec ? ' <span class="rec">Recommended</span>' : ""}</span></button>${sv ? `<button class="csee${here ? " here" : ""}" data-csee="${o.see}" aria-label="See frame ${sv.f} variant ${sv.v.toUpperCase()}">${here ? "Showing" : "See"} ${sv.f === g.f ? "" : sv.f}${sv.v.toUpperCase()}</button>` : ""}</div>`;
          }
          h += `</div><p class="cwhy t3">Why recommended: ${cesc(p.why)}</p>`;
        }
        h += `<label class="cnote"><span class="t3">Your words (optional)</span><textarea rows="2" data-cnote="${c.id}">${cesc(a.note || "")}</textarea></label></article>`;
      }
    }
    h += `</section>`;
  }
  h += `</div>`;
  el.innerHTML = h;
  const body = el.querySelector(".calls-body");
  if (body) {
    // A newly opened group starts at its own heading; the same group keeps where you were.
    const sec = body.querySelector(".cgroup.open");
    if (CS.shown !== open && sec) body.scrollTop = Math.max(0, sec.offsetTop - body.offsetTop);
    else body.scrollTop = CS.scroll;
  }
  CS.shown = open;
}

function answersText() {
  const lines = ["Calendar round 1b answers"];
  for (const g of GROUPS) {
    lines.push("", `[${groupName(g)}]`);
    for (const c of g.calls) {
      const a = ANS[c.id] || { picks: {} };
      const parts = c.parts.map((p) => { const k = a.picks && a.picks[p.k]; const o = p.opts.find((x) => x.k === k); return (c.parts.length > 1 ? p.k + ": " : "") + (o ? `${o.k} (${o.l})` : "—"); });
      lines.push(`${c.id}: ${parts.join(" · ")}${a.note ? " — " + a.note : ""}`);
    }
  }
  return lines.join("\n");
}

async function saveAnswer(id) {
  const a = ANS[id]; if (!a) return;
  const body = { picks: a.picks || {}, note: a.note || "", at: new Date().toISOString() };
  if (CS.db) { try { await CS.db.doc("answers/" + id).set(body); return; } catch (e) { CS.store = "local"; } }
  try { localStorage.setItem("cal-1b-answers", JSON.stringify(ANS)); } catch (e) { /* no storage */ }
}

  ev.stopPropagation();
  if (t.id === "callsToggle") { CS.hidden = !CS.hidden; render(); return; }
  if (t.dataset.cact === "hide") { CS.hidden = true; render(); return; }
  if (t.dataset.cact === "copy") {
    const txt = answersText();
    const done = () => { CS.copied = true; callsPanel(); setTimeout(() => { CS.copied = false; callsPanel(); }, 1600); };
    try { navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt)); } catch (e) { fallbackCopy(txt); }
    return;
  }
  if (t.dataset.cgroup) {
    const g = GROUPS.find((x) => x.id === t.dataset.cgroup); const open = CS.open || `f${S.f}`;
    if (g.id === open) { CS.open = "__none"; callsPanel(); return; }
    if (g.f) { go(g.f); return; }
    CS.open = g.id; callsPanel(); return;
  }
  if (t.dataset.csee) { const cur = CS.open || `f${S.f}`; const { f, v } = parseSee(t.dataset.csee); S.f = f; S.v = v; S.sel = null; S.dd = false; S.pop = null; CS.open = cur; render(); return; }
  if (t.dataset.cpick) {
    const [id, pk, ok] = t.dataset.cpick.split("|");
    const a = (ANS[id] = ANS[id] || { picks: {}, note: "" });
    a.picks = { ...a.picks, [pk]: ok };
    callsPanel(); saveAnswer(id);
  }
}, true);
function fallbackCopy(txt) {
  const ta = document.createElement("textarea"); ta.value = txt; ta.className = "copybox"; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); CS.copied = true; } catch (e) { /* leave it selected */ }
  setTimeout(() => ta.remove(), 4000); callsPanel();
}
document.addEventListener("input", (ev) => { const id = ev.target.dataset && ev.target.dataset.cnote; if (!id) return; const a = (ANS[id] = ANS[id] || { picks: {}, note: "" }); a.note = ev.target.value; });
document.addEventListener("change", (ev) => { const id = ev.target.dataset && ev.target.dataset.cnote; if (id) saveAnswer(id); });

(async function loadAnswers() {
  try { const raw = localStorage.getItem("cal-1b-answers"); if (raw) Object.assign(ANS, JSON.parse(raw)); CS.store = "local"; } catch (e) { CS.store = "local"; }
  const use = window.claude && window.claude.use;
  if (!use) { callsPanel(); return; }
  let db = null; try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) { callsPanel(); return; }
  CS.db = db; CS.store = "db";
  db.collection("answers").onSnapshot((snap) => {
    for (const d of snap.docs) { const b = d.data(); if (b) ANS[d.id] = { picks: { ...(b.picks || {}) }, note: typeof b.note === "string" ? b.note : "" }; }
    if (!document.activeElement || !document.activeElement.dataset || !document.activeElement.dataset.cnote) callsPanel();
  }, () => { CS.store = "local"; callsPanel(); });
})();

/* ── Interaction ──────────────────────────────────────────────────── */
function go(f, v) { CS.open = null; S.f = f; S.v = v || (f === 1 ? "b" : Object.keys(FR[f].v)[0]); S.sel = null; S.dd = false; S.pop = null; render(); }
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button"); if (!t) { if (S.dd || S.pop) { S.dd = false; S.pop = null; render(); } return; }
  if (t.dataset.f) return go(+t.dataset.f);
  if (t.dataset.v) { S.v = t.dataset.v; S.sel = null; S.pop = null; return render(); }
  if (t.dataset.h !== undefined) { S.hard = t.dataset.h; S.sel = null; S.pop = null; return render(); }
  if (t.dataset.t) { S.theme = t.dataset.t; return render(); }
  if (t.dataset.d) { S.dens = t.dataset.d; return render(); }
  if (t.id === "rpsw") { S.dd = !S.dd; return render(); }
  if (t.id === "keysbtn") { S.keys = true; return render(); }
  if (t.id === "keysclose") { S.keys = false; return render(); }
  if (t.dataset.view) { S.dd = false; return render(); }
  if (t.dataset.fold) { S.pop = t.dataset.fold.split(","); return render(); }
  if (t.dataset.id) { S.sel = t.dataset.id; S.pop = null; const keep = t.dataset.id; render(); const n = document.querySelector(`[data-id="${keep}"]`); if (n) n.focus(); }
});
const chipsInOrder = () => [...document.querySelectorAll(".ev[data-id], .lrow[data-id]")];
document.addEventListener("keydown", (ev) => {
  if (ev.key === "F6") { const zones = [document.getElementById("gs"), document.querySelector("#rpanel button"), document.querySelector("#railp .rrow")].filter(Boolean); const i = zones.findIndex((z) => z.contains(document.activeElement) || z === document.activeElement || (z.closest("aside, main") && z.closest("aside, main").contains(document.activeElement))); const n = zones[(i + 1) % zones.length]; if (n) n.focus(); ev.preventDefault(); return; }
  if (ev.target.matches && ev.target.matches("input, textarea")) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key;
  if (/^[1-9]$/.test(k)) { go(+k); ev.preventDefault(); return; }
  if (k === "?") { S.keys = !S.keys; render(); return; }
  if (k === "v" || k === "V") { const ks = Object.keys(FR[S.f].v); S.v = ks[(ks.indexOf(S.v) + 1) % ks.length]; S.sel = null; S.pop = null; render(); return; }
  if (k === "j" || k === "k") { const list = chipsInOrder(); if (!list.length) return; let i = list.findIndex((n) => n.dataset.id === S.sel); i = k === "j" ? Math.min(list.length - 1, i + 1) : Math.max(0, i - 1); S.sel = list[i].dataset.id; render(); const n = document.querySelector(`[data-id="${S.sel}"]`); if (n) n.focus(); return; }
  if (k === "Escape") { S.dd = false; S.sel = null; S.pop = null; S.keys = false; render(); return; }
  if ((k === "Enter" || k === " ") && document.activeElement && document.activeElement.dataset && document.activeElement.dataset.id) { S.sel = document.activeElement.dataset.id; render(); const n = document.querySelector(`[data-id="${S.sel}"]`); if (n) n.focus(); ev.preventDefault(); }
});
window.addEventListener("resize", () => render());
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());

/* ── States for the critic ───────────────────────────────────────── */
const STATES = [];
STATES.push({ id: "f1-b", label: "A normal week: sessions, Up next, due as chips and counts", f: 1, v: "b" });
for (const f of Object.keys(FR)) for (const v of Object.keys(FR[f].v)) { if (+f === 1 && v === "b") continue; STATES.push({ id: `f${f}-${v}`, label: `${FR[f].n}: ${FR[f].v[v]}`, f: +f, v }); }
STATES.push({ id: "empty", label: "First week, nothing connected", f: 1, v: "b", hard: "empty" }, { id: "loading", label: "Loading, skeleton in the last shape", f: 1, v: "b", hard: "loading" }, { id: "error", label: "One Google account didn't load", f: 1, v: "b", hard: "error" }, { id: "offline", label: "Offline with 2 changes waiting", f: 1, v: "b", hard: "offline" }, { id: "long", label: "Long titles", f: 1, v: "b", hard: "long" }, { id: "dense", label: "A dense week, 61 events", f: 1, v: "b", hard: "dense" }, { id: "light", label: "Light theme", f: 1, v: "b", theme: "light" }, { id: "compact", label: "Compact density", f: 1, v: "b", dens: "compact" }, { id: "densest", label: "Dense density", f: 1, v: "b", dens: "dense" }, { id: "narrow", label: "1024 × 700 window", f: 1, v: "b", hard: "narrow" });
window.studio = {
  states: STATES.map(({ id, label }) => ({ id, label })),
  set(id) { const s = STATES.find((x) => x.id === id) || STATES[0]; S.f = s.f; S.v = s.v; S.hard = s.hard || ""; S.theme = s.theme || "dark"; S.dens = s.dens || "comfortable"; S.sel = null; S.dd = false; S.pop = null; S.keys = false; render(); },
};
render();
</script>
