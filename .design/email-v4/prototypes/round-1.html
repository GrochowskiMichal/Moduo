/* ── House tokens: dark (tokens.css :root / [data-theme=dark]) ───────────── */

  --text-3xs: 0.5625rem; --text-2xs: 0.6875rem; --text-xs: 0.75rem; --text-sm: 0.8125rem; --text-base: 0.875rem; --text-md: 0.9375rem; --text-xl: 1.25rem;

  --muted: var(--neutral-100); --muted-foreground: var(--neutral-600); --border: var(--neutral-200);

        ${strip("Set aside, answering in one pass", "Opening Set aside (calls 8, 9). With 51 a, it opens on the first email.", a("Send & next", "⌘↵", true) + a("Skip", "j") + a("Done", "e") + a("Snooze", "s") + more + note("4 left · Esc"), { tag: "mode" })}
        ${strip("Writing a reply", "Unchanged bar: Send lives in the composer, as in Chat (call 50).", tools)}
      </div>`;
      html = topbar() + `<main class="centre" style="grid-column: 1 / -1">${body}</main>` + bar("plain"); break;
    }
    case "compose-c": {
      const c = `<section class="composer" aria-label="New email">
        <div class="cfield">From <span class="v">maciej@northwind.studio</span><span style="flex:1"></span>${K("⌘1")}</div>
        <div class="cfield">To <span class="chip" style="color:var(--foreground)">${I("users")}Fjordline team · 3</span><span class="t3" style="font-size:var(--text-xs)">Ana Ruiz, Jonas Berg, Mia Holm</span><span style="flex:1"></span>${K("⌘2")}</div>
        <div class="cfield">Cc <span class="v">Tomasz Nowak</span><span style="flex:1"></span>${K("⌘3")}</div>
        <div class="cfield">Bcc <span class="chip" style="color:var(--foreground)">log@crm.example<button class="btn icon" style="height:16px;width:16px" aria-label="Remove from this email">×</button></span><span class="t3" style="font-size:var(--text-xs)">added by this account</span></div>
        <div class="cfield">Subject <span class="v">Spring campaign: final files</span><span style="flex:1"></span>${K("⌘4")}</div>
        <div class="cbody">Hi all,<br><br>The final files are in the shared folder<span class='caret'></span><span style="float:right">${K("⌘5")}</span></div></section>`;
      const notes = `<div class="pnote"><b>Groups:</b> “Fjordline team” is everyone tagged Fjordline in Contacts. <b>Auto Bcc:</b> set once per account in Settings → Mail; × removes it from this email only. <b>⌘1–⌘5</b> jump to each field.</div>
        <div class="pnote"><b>Send again</b> sits on emails you sent: <span class="chip" style="color:var(--foreground)">${I("send")}Send again</span> opens a copy as a new draft, for the monthly invoice reminder.</div>`;
      html = topbar() + L + `<main class="centre">${listCol()}<section class="reader"><div class="rscroll"><div class="rin"><h1 class="subj">New email</h1>${c}${notes}</div></div></section></main>` + R("person") + bar("plain"); break;
    }
    case "compose-d": {
      const win = `<div class="popwin" role="dialog" aria-label="Draft window"><div class="wbar"><i></i><i></i><i></i><span style="flex:1;text-align:center">Re: Spring campaign: hero photos · draft</span>${K("⌘⇧D")}</div>${composerReply({ cc: "Tomasz Nowak", body: "Hi Ana,<br><br>Two crops attached: square for social, wide for the terminal screens. On the print colours, I'd keep the warmer version because<span class='caret'></span>" })}<div style="display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--border)"><button class="btn primary">Send ${K("⌘↵")}</button><span style="flex:1"></span><button class="btn">Put back ${K("⌘⇧D")}</button></div></div>`;
      html = topbar() + L + `<main class="centre">${listCol({ sel: "t2" })}<section class="reader"><div class="rscroll"><div class="rin"><div class="pnote">The main window is free again: you keep reading and clearing the inbox. The draft is its own small window on top; ⌘⇧D puts it back under its email.</div></div></div></section></main>` + R("person", { pk: "sam" }) + bar("plain") + win; break;
    }
  }
  app$.className = "app " + cls;
  app$.innerHTML = html;
  app$.style.position = "relative";
  // strip
  document.getElementById("frames").innerHTML = FRAMES.map((f) => { const cs = CALLS.filter((c) => c.f === f.id); const done = cs.filter((c) => ans(c.n)).length; return `<button class="${f.id === S.f ? "on" : ""}" data-f="${f.id}" title="Calls ${cs.map((c) => c.n).join(", ")}">${f.k} ${f.name}<span class="cnt ${done === cs.length ? "done" : ""}">${done}/${cs.length}</span></button>`; }).join("");
  const F = FRAMES.find((f) => f.id === S.f);
  document.getElementById("variants").innerHTML = F.vars.length > 1 ? F.vars.map(([v, l]) => `<button class="${v === S.v ? "on" : ""}" data-v="${v}">${l}</button>`).join("") : "";
  document.getElementById("cap").innerHTML = (CAPS[key] || "") + ` <span class="t3">Keys: 1–9, 0 frames · V variant · T theme · D density · C calls</span>`;
  document.querySelectorAll("#themeSeg button").forEach((b) => b.classList.toggle("on", b.dataset.th === S.theme));
  document.querySelectorAll("#denSeg button").forEach((b) => b.classList.toggle("on", b.dataset.den === S.den));
  renderCalls(key);
  try { if (!critic) localStorage.setItem("mailv4r1", JSON.stringify(S)); } catch (e) {}
}

/* ── calls pane ── */
let A = {};
try { A = JSON.parse(localStorage.getItem("mailv4r1-answers") || "{}") || {}; } catch (e) { A = {}; }
Object.entries(GIVEN).forEach(([n, g]) => { if (!A[n]) A[n] = { ...g }; });
function ans(n) { return !!(A[n] && (A[n].opt || (A[n].note || "").trim())); }
const saveA = () => { try { localStorage.setItem("mailv4r1-answers", JSON.stringify(A)); } catch (e) {} };
function renderCalls(key) {
  const pane = document.getElementById("calls"), tg = document.getElementById("callsToggle");
  pane.hidden = !S.calls;
  tg.innerHTML = `${S.calls ? "Hide" : "Show"} calls ${K("c")}`;
  tg.setAttribute("aria-pressed", String(!!S.calls));
  if (!S.calls) return;
  const F = FRAMES.find((f) => f.id === S.f);
  const cs = CALLS.filter((c) => c.f === S.f);
  const total = CALLS.filter((c) => ans(c.n)).length;
  document.getElementById("clTitle").textContent = S.f === "text" ? "Calls with nothing to draw" : `Calls for ${F.name}`;
  document.getElementById("clCount").textContent = `${total} of ${CALLS.length} answered`;
  document.getElementById("clMeter").style.width = `${(total / CALLS.length) * 100}%`;
  document.getElementById("clSub").innerHTML = S.f === "text" ? "These change behaviour, not the screen." : `Calls ${cs.map((c) => c.n).join(", ")}. “See” switches the screen to that option. ★ = load-bearing.`;
  document.getElementById("clList").innerHTML = cs.map((c) => {
    const a = A[c.n] || {};
    const opts = c.o.map(([k, l, v]) => `<button class="opt ${a.opt === k ? "pick" : ""} ${v && v === key ? "showing" : ""}" data-call="${c.n}" data-opt="${k}" ${v ? `data-show="${v}"` : ""} aria-pressed="${a.opt === k}"><span class="k">${k}</span><span class="l">${l}</span>${k === c.rec ? `<span class="rec">Recommended</span>` : ""}${v ? `<span class="eye">${v === key ? "on screen" : "see"}</span>` : ""}</button>`).join("")
      + `<button class="opt ${a.opt === "x" ? "pick" : ""}" data-call="${c.n}" data-opt="x" aria-pressed="${a.opt === "x"}"><span class="k">✎</span><span class="l">Something else (write it below)</span></button>`;
    const see = (c.see || []).map(([v, l]) => `<button class="seebtn ${v === key ? "on" : ""}" data-show="${v}">${l}</button>`).join("");
    return `<article class="ccard ${ans(c.n) ? "answered" : ""}" aria-label="Call ${c.n}">
      <div class="ct"><span class="no">${c.n}${c.s ? "★" : ""}</span><span class="ttl">${c.t}</span>${ans(c.n) ? `<span class="ok">✓ answered</span>` : ""}</div>
      <div class="q">${c.q}</div>
      ${c.look ? `<div class="nodraw">${c.look}</div>` : ""}
      <div class="opts">${opts}</div>
      ${see ? `<div class="seeline">Also see: ${see}</div>` : ""}
      ${c.why ? `<div class="why"><b>Why ${c.rec}:</b> ${c.why}</div>` : ""}
      ${NEWS[c.n] ? `<div class="reply" style="border-left-color:var(--label-amber)"><span class="who">Since v1.8.1</span><span>${NEWS[c.n]}</span></div>` : ""}
      ${REPLIES[c.n] ? `<div class="reply"><span class="who">Your question, answered</span><span>${REPLIES[c.n]}</span></div>` : ""}
      <textarea data-note="${c.n}" placeholder="Note (optional)" aria-label="Note on call ${c.n}">${esc(a.note || "")}</textarea>
    </article>`;
  }).join("");
}
function answersText() {
  return CALLS.slice().sort((x, y) => x.n - y.n).filter((c) => ans(c.n)).map((c) => { const a = A[c.n]; const o = a.opt === "x" ? "other" : a.opt || ""; const note = (a.note || "").trim(); return `${c.n}. ${o}${note ? (o ? " · " : "") + note : ""}`; }).join("\n");
}
document.addEventListener("input", (e) => {
  const t = e.target.closest && e.target.closest("textarea[data-note]"); if (!t) return;
  const n = t.dataset.note; A[n] = { ...(A[n] || {}), note: t.value }; saveA();
  t.closest(".ccard").classList.toggle("answered", ans(n));
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "copyBtn") { const txt = answersText(); const msg = document.getElementById("clMsg");
    const fallback = () => { msg.innerHTML = `<textarea class="copybox" readonly>${esc(txt)}</textarea>`; const ta = msg.querySelector("textarea"); ta.focus(); ta.select(); };
    try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = `Copied ${txt.split("\n").filter(Boolean).length} answers. Paste them into the chat.`; }, fallback); } catch (err) { fallback(); } return; }
  if (b.id === "callsToggle") { S.calls = !S.calls; render(); return; }
  if (b.dataset.opt || b.dataset.show) {
    const y = document.getElementById("clList").scrollTop;
    if (b.dataset.opt) { const n = b.dataset.call; const cur = A[n] || {}; A[n] = { ...cur, opt: cur.opt === b.dataset.opt ? "" : b.dataset.opt }; saveA(); }
    if (b.dataset.show) { const [f, v] = b.dataset.show.split("-"); S.f = f; S.v = v; }
    render(); document.getElementById("clList").scrollTop = y; return; }
  if (b.dataset.f) { S.f = b.dataset.f; S.v = FRAMES.find((f) => f.id === S.f).vars[0][0]; render(); }
  else if (b.dataset.v) { S.v = b.dataset.v; render(); }
  else if (b.dataset.th) { S.theme = b.dataset.th; render(); }
  else if (b.dataset.den) { S.den = b.dataset.den; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest("textarea, input")) return;
  if (e.key === "c" || e.key === "C") { S.calls = !S.calls; render(); return; }
  const f = FRAMES.find((x) => x.k === e.key);
  if (f) { S.f = f.id; S.v = f.vars[0][0]; render(); return; }
  const F = FRAMES.find((x) => x.id === S.f);
  if (e.key === "v" || e.key === "V") { const i = F.vars.findIndex(([v]) => v === S.v); S.v = F.vars[(i + (e.shiftKey ? F.vars.length - 1 : 1)) % F.vars.length][0]; render(); }
  else if (e.key === "t" || e.key === "T") { S.theme = S.theme === "dark" ? "light" : "dark"; render(); }
  else if (e.key === "d" || e.key === "D") { const ds = ["comfortable", "compact", "dense"]; S.den = ds[(ds.indexOf(S.den) + 1) % 3]; render(); }
});

/* studio contract: every frame×variant, plus density and light for the default */
const STATES = [];
FRAMES.forEach((f) => f.vars.forEach(([v, l]) => STATES.push({ id: `${f.id}-${v}`, label: `${f.name}: ${l.replace(/^\w · /, "")}` })));
STATES.splice(1, 0, { id: "dense-dark", label: "Split layout, dense rows" }, { id: "compact-light", label: "Split layout, compact rows, light theme" });
window.studio = {
  states: STATES,
  set(id) {
    if (id === "dense-dark") { S = { f: "layout", v: "a", theme: "dark", den: "dense" }; }
    else if (id === "compact-light") { S = { f: "layout", v: "a", theme: "light", den: "compact" }; }
    else { const [f, v] = id.split("-"); S = { ...S, f, v, den: "comfortable" }; if (critic) S.theme = "dark"; }
    render();
  },
};
render();
</script>
