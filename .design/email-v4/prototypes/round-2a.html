/* ── House tokens: dark (tokens.css :root / [data-theme=dark]) ───────────── */
:root {

  --label-blue: oklch(0.66 0.18 245); --label-green: oklch(0.72 0.17 150); --label-amber: oklch(0.80 0.16 75);

  color-scheme: dark;

  --state-selected: color-mix(in oklab, var(--primary) 13%, transparent);
  --hairline: color-mix(in oklab, var(--foreground) 10%, transparent);
  --control-raised: color-mix(in oklab, var(--foreground) 14%, var(--muted));

  --text-3xs: 0.5625rem; --text-2xs: 0.6875rem; --text-xs: 0.75rem; --text-sm: 0.8125rem; --text-base: 0.875rem; --text-md: 0.9375rem; --text-xl: 1.25rem;
  --row-h: 2.25rem; --ctrl-h: 2rem; --ctrl-h-sm: 1.625rem; --icon-sm: .875rem; --icon: 1rem; --bar-h: 3rem;

  --primary: var(--neutral-950); --primary-foreground: oklch(0.97 0 0); color-scheme: light;
  --label-blue: oklch(0.55 0.18 245); --label-green: oklch(0.55 0.15 150); --label-amber: oklch(0.62 0.15 70); --label-violet: oklch(0.52 0.20 295); --label-teal: oklch(0.55 0.11 200);
} }
:root[data-theme="light"] {
  --background: var(--neutral-50); --foreground: var(--neutral-950); --card: oklch(1 0 0); --popover: oklch(1 0 0);
  --muted: var(--neutral-100); --muted-foreground: var(--neutral-600); --border: var(--neutral-200);
  --primary: var(--neutral-950); --primary-foreground: oklch(0.97 0 0); color-scheme: light;
  --label-blue: oklch(0.55 0.18 245); --label-green: oklch(0.55 0.15 150); --label-amber: oklch(0.62 0.15 70); --label-violet: oklch(0.52 0.20 295); --label-teal: oklch(0.55 0.11 200);
}

.x { border-radius: var(--radius-sm); }

/* ── Prototype strip (not app UI) ────────────────────────────────────────── */
.stage { display: flex; flex-direction: column; height: 100%; min-height: 640px; }

  background: repeating-linear-gradient(-45deg, var(--strip-a) 0 7px, var(--popover) 7px 14px); border-bottom: 1px dashed color-mix(in oklab, var(--foreground) 26%, transparent); }

.cap { flex: 1 1 320px; min-width: 0; color: var(--muted-foreground); }

.pnote { font-size: var(--text-xs); line-height: 1.45; color: var(--muted-foreground); padding: 4px 8px; border-radius: var(--radius-sm); border: 1px dashed color-mix(in oklab, var(--foreground) 26%, transparent);
  background: repeating-linear-gradient(-45deg, var(--strip-a) 0 7px, var(--popover) 7px 14px); }
.pnote b { color: var(--foreground); }
.critic .strip, .critic .pnote { display: none !important; }

/* ── App frame: 3×3 ─────────────────────────────────────────────────────── */
.appwrap { flex: 1; min-height: 0; overflow: auto; }
.app { height: 100%; min-width: 1024px; min-height: 600px; display: grid; grid-template-rows: 2.5rem 1fr var(--bar-h); grid-template-columns: 15rem 1fr 20rem; background: var(--background); }

.skip { position: absolute; left: 8px; top: -40px; z-index: 30; background: var(--popover); color: var(--foreground); padding: 6px 10px; border-radius: var(--radius-md); border: 1px solid var(--border); }
.skip:focus { top: 6px; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid var(--border); }
.brand { font-weight: 600; letter-spacing: -.01em; }

.tb-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

.pa { --av: color-mix(in oklab, var(--label-blue) 55%, var(--card)); } .pb { --av: color-mix(in oklab, var(--label-teal) 50%, var(--card)); }
.pc { --av: color-mix(in oklab, var(--label-violet) 52%, var(--card)); } .pd { --av: color-mix(in oklab, var(--label-amber) 40%, var(--card)); }
.pe { --av: color-mix(in oklab, var(--label-green) 45%, var(--card)); } .pf { --av: color-mix(in oklab, var(--foreground) 22%, var(--card)); }
.btn { height: var(--ctrl-h-sm); padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: 500; color: var(--muted-foreground); white-space: nowrap; transition: background-color var(--motion-fade) var(--ease-out); }

/* centre */
.centre { min-width: 0; display: flex; min-height: 0; }

.rows { overflow: auto; flex: 1; min-height: 0; }

/* reader */
.reader { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }

/* ── Round 2a additions ─────────────────────────────────────────────────── */
/* list row: one fixed slot at the right end holds the date or, on hover, four icons (call 54 a) */
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) 6.5rem; grid-template-areas: "ava who slot" "ava sub sub" "ava snip snip" "ava flags flags"; gap: 2px 12px; align-items: center; padding: 10px 12px 10px 16px; min-height: var(--mail-row); position: relative; cursor: default; }

/* panels and overlays */

.app.narrow { max-width: 1120px; margin: 0 auto; grid-template-columns: 15rem 1fr 0; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

.app.narrow.over .panel { display: flex; position: absolute; right: 0; top: 2.5rem; bottom: var(--bar-h); width: 20rem; z-index: 8; box-shadow: -16px 0 40px color-mix(in oklab, var(--background) 55%, transparent); }

.toast { left: 50%; }

function render(o = {}) {

  const view = fn();
  app$.setAttribute("data-density", view.den || S.den);
  app$.className = "app " + (view.cls || "");
  app$.innerHTML = view.html;
  app$.style.position = "relative";
  WIN = false;
  try { view.after && view.after(); } catch (e) {}
  document.getElementById("frames").innerHTML = FRAMES.map((f) => { const cs = CALLS.filter((c) => c.f === f.id); return `<button class="${f.id === S.f ? "on" : ""}" data-f="${f.id}">${f.k ? `<span class="k">${f.k}</span>` : ""}${f.name}${cs.length ? `<span class="cnt ${cs.every((c) => ans(c.n)) ? "done" : ""}">${cs.map((c) => c.n).join(" ")}</span>` : ""}</button>`; }).join("");
  const F = FRAMES.find((f) => f.id === S.f);
  document.getElementById("variants").innerHTML = F.vars.map(([v, l]) => `<button class="${v === S.v ? "on" : ""}" data-v="${v}">${l}</button>`).join("");
  document.getElementById("cap").innerHTML = (CAPS[key] || "") + ` <span class="t3">Keys: 1–9, 0 frames · V variant · T theme · D density · C calls${S.f === "inbox" && (S.v === "full" || S.v === "split") ? " · live: j k ↵ Esc e" : ""}</span>`;
  document.querySelectorAll("#themeSeg button").forEach((b) => b.classList.toggle("on", b.dataset.th === S.theme));
  document.querySelectorAll("#denSeg button").forEach((b) => b.classList.toggle("on", b.dataset.den === (view.den || S.den)));
  renderCalls(key);
  if (o.focus) { const r = document.querySelector(".row.sel") || document.querySelector(".rtool button"); r && r.focus && r.focus(); }
  try { if (!critic) localStorage.setItem("mailv4r2a", JSON.stringify({ f: S.f, v: S.v, theme: S.theme, den: S.den, calls: S.calls })); } catch (e) {}
}

/* ── calls pane ── */
let ANS = {};
try { ANS = JSON.parse(localStorage.getItem("mailv4r2a-answers") || "{}") || {}; } catch (e) { ANS = {}; }
Object.entries(GIVEN).forEach(([n, g]) => { if (!ANS[n]) ANS[n] = { ...g }; });
function ans(n) { return !!(ANS[n] && (ANS[n].opt || (ANS[n].note || "").trim())); }
const saveA = () => { try { localStorage.setItem("mailv4r2a-answers", JSON.stringify(ANS)); } catch (e) {} };
function callCard(c, key, here) {
  const a = ANS[c.n] || {};
  const opts = c.o.map(([k, l, v]) => `<button class="opt ${a.opt === k ? "pick" : ""} ${v && v === key ? "showing" : ""}" data-call="${c.n}" data-opt="${k}" ${v ? `data-show="${v}"` : ""} aria-pressed="${a.opt === k}"><span class="k">${k}</span><span class="l">${l}</span>${k === c.rec ? `<span class="rec">Recommended</span>` : ""}${v ? `<span class="eye">${v === key ? "on screen" : "see"}</span>` : `<span class="eye" style="text-decoration:none">not drawn</span>`}</button>`).join("")
    + `<button class="opt ${a.opt === "x" ? "pick" : ""}" data-call="${c.n}" data-opt="x" aria-pressed="${a.opt === "x"}"><span class="k">✎</span><span class="l">Something else (write it below)</span></button>`;
  return `<article class="ccard ${ans(c.n) ? "answered" : ""} ${here ? "here" : ""}" aria-label="Call ${c.n}"><div class="ct"><span class="no">${c.n}${c.s ? "★" : ""}</span><span class="ttl">${c.t}</span>${ans(c.n) ? `<span class="ok">✓ answered</span>` : ""}</div><div class="q">${c.q}</div><div class="opts">${opts}</div><div class="why"><b>Why ${c.rec}:</b> ${c.why}</div><textarea data-note="${c.n}" placeholder="Note (optional)" aria-label="Note on call ${c.n}">${esc(a.note || "")}</textarea></article>`;
}
function renderCalls(key) {
  const pane = document.getElementById("calls"), tg = document.getElementById("callsToggle");
  pane.hidden = !S.calls || critic;
  tg.innerHTML = `${S.calls ? "Hide" : "Show"} calls ${K("c")}`;
  tg.setAttribute("aria-pressed", String(!!S.calls));
  if (pane.hidden) return;
  const here = CALLS.filter((c) => c.f === S.f), rest = CALLS.filter((c) => c.f !== S.f);
  const total = CALLS.filter((c) => ans(c.n)).length;
  document.getElementById("clTitle").textContent = "Calls 52–62";
  document.getElementById("clCount").textContent = `${total} of ${CALLS.length} answered`;
  document.getElementById("clMeter").style.width = `${(total / CALLS.length) * 100}%`;
  document.getElementById("clSub").innerHTML = here.length ? `This frame draws call${here.length > 1 ? "s" : ""} ${here.map((c) => c.n).join(", ")}. “See” switches the screen. ★ = load-bearing.` : "No open call on this frame: the caption says who settles what's shown.";
  document.getElementById("clList").innerHTML = here.map((c) => callCard(c, key, true)).join("") + (rest.length ? `<div class="cl-sep">Other frames</div>` : "") + rest.map((c) => callCard(c, key, false)).join("");
}
function answersText() {
  return CALLS.slice().sort((x, y) => x.n - y.n).filter((c) => ans(c.n)).map((c) => { const a = ANS[c.n]; const o = a.opt === "x" ? "other" : a.opt || ""; const note = (a.note || "").trim(); return `${c.n}. ${o}${note ? (o ? " · " : "") + note : ""}`; }).join("\n");
}

function liveList() { return PERSONAL.filter((t) => !L.done.includes(t.id)); }
function move(d) { const l = liveList(); const i = l.findIndex((t) => t.id === L.sel); const n = l[Math.max(0, Math.min(l.length - 1, i + d))]; if (n) L.sel = n.id; }
function doneSel(id) { const l = liveList(); const i = l.findIndex((t) => t.id === (id || L.sel)); if (i < 0) return; const t = l[i]; L.done.push(t.id); L.toast = `Done · “${t.sub.length > 34 ? t.sub.slice(0, 34) + "…" : t.sub}” is in Archive`; L.undo = t.id; const nx = l[i + 1] || l[i - 1]; L.sel = nx ? nx.id : null; if (!nx) L.open = false; }
document.addEventListener("input", (e) => {
  const t = e.target.closest && e.target.closest("textarea[data-note]"); if (!t) return;
  const n = t.dataset.note; ANS[n] = { ...(ANS[n] || {}), note: t.value }; saveA();
  t.closest(".ccard").classList.toggle("answered", ans(n));
});
document.addEventListener("click", (e) => {
  const sk$ = e.target.closest && e.target.closest("[data-skip]"); if (sk$) { e.preventDefault(); document.querySelector(".row.sel, .row")?.focus(); return; }
  const rowEl = e.target.closest && e.target.closest(".row[data-row]");
  const b = e.target.closest && e.target.closest("button");
  if (isLive()) {
    if (b && b.dataset.rowact === "done") { doneSel(b.closest(".row").dataset.row); render(); return; }
    if (b && b.dataset.act === "undo") { L.done = L.done.filter((x) => x !== L.undo); L.sel = L.undo; L.toast = null; render(); return; }
    if (b && b.dataset.act === "back") { L.open = false; render({ focus: true }); return; }
    if (rowEl && !b) { L.sel = rowEl.dataset.row; if (e.detail === 2 && S.v === "full") L.open = true; render({ focus: true }); return; }
  }
  if (!b) return;
  if (b.id === "copyBtn") { const txt = answersText(); const msg = document.getElementById("clMsg");
    const fallback = () => { msg.innerHTML = `<textarea class="copybox" readonly>${esc(txt)}</textarea>`; const ta = msg.querySelector("textarea"); ta.focus(); ta.select(); };
    try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = `Copied ${txt.split("\n").filter(Boolean).length} answers. Paste them into the chat.`; }, fallback); } catch (err) { fallback(); } return; }
  if (b.id === "callsToggle") { S.calls = !S.calls; render(); return; }
  if (b.dataset.opt || b.dataset.show) {
    const y = document.getElementById("clList").scrollTop;
    if (b.dataset.opt) { const n = b.dataset.call; const cur = ANS[n] || {}; ANS[n] = { ...cur, opt: cur.opt === b.dataset.opt ? "" : b.dataset.opt }; saveA(); }
    if (b.dataset.show) { const i = b.dataset.show.indexOf("-"); S.f = b.dataset.show.slice(0, i); S.v = b.dataset.show.slice(i + 1); }
    render(); document.getElementById("clList").scrollTop = y; return; }
  if (b.dataset.f) { S.f = b.dataset.f; S.v = FRAMES.find((f) => f.id === S.f).vars[0][0]; render(); }
  else if (b.dataset.v) { S.v = b.dataset.v; render(); }
  else if (b.dataset.th) { S.theme = b.dataset.th; render(); }
  else if (b.dataset.den) { S.den = b.dataset.den; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest("textarea, input")) return;
  if (isLive()) {
    const k = e.key;
    if (k === "j" || k === "ArrowDown") { e.preventDefault(); move(1); render({ focus: true }); return; }
    if (k === "k" || k === "ArrowUp") { e.preventDefault(); move(-1); render({ focus: true }); return; }
    if (k === "Enter" && S.v === "full" && !(e.target.closest && e.target.closest("button"))) { e.preventDefault(); L.open = true; render({ focus: true }); return; }
    if (k === "Escape") { if (L.toast) L.toast = null; else L.open = false; render({ focus: true }); return; }
    if (k === "e") { doneSel(); render({ focus: true }); return; }
  }
  if (e.key === "c" || e.key === "C") { if (!critic) { S.calls = !S.calls; render(); } return; }
  const f = FRAMES.find((x) => x.k && x.k === e.key);
  if (f) { S.f = f.id; S.v = f.vars[0][0]; render(); return; }
  const F = FRAMES.find((x) => x.id === S.f);
  if (e.key === "v" || e.key === "V") { const i = F.vars.findIndex(([v]) => v === S.v); S.v = F.vars[(i + (e.shiftKey ? F.vars.length - 1 : 1)) % F.vars.length][0]; render(); }
  else if (e.key === "t" || e.key === "T") { S.theme = S.theme === "dark" ? "light" : "dark"; render(); }
  else if (e.key === "d" || e.key === "D") { const ds = ["comfortable", "compact", "dense"]; S.den = ds[(ds.indexOf(S.den) + 1) % 3]; render(); }
});

/* studio contract: every frame × variant */
const STATES = [];
FRAMES.forEach((f) => f.vars.forEach(([v, l]) => STATES.push({ id: `${f.id}-${v}`, label: `${f.name}: ${l}` })));
window.studio = {
  states: STATES,
  set(id) {
    const i = id.indexOf("-");
    S = { ...S, f: id.slice(0, i), v: id.slice(i + 1), den: "comfortable" };
    if (critic) S.theme = "dark";
    L.open = false; L.toast = null; L.done = []; L.sel = "t1";
    render();
  },
};
if (!V[`${S.f}-${S.v}`]) { S.f = "inbox"; S.v = "full"; }
render();
</script>
