name: landing-deploy

# Deploys the landing Worker (apps/landing/wrangler.jsonc, specs/platform-v2.md, PLAT-5).
#
# Staging only (https://staging.moduo.app): after `checks` passes on a develop push, for exactly
# the commit checks tested, or by hand. The staging build: the portal at /, the marketing page at
# /landing (noindex). Production (moduo.app) is deployed by release.yml on a vX.Y.Z tag.
#
# The build is a copy step (no app build), so a deploy takes well under a minute. Roll back from
# the Cloudflare dashboard or `wrangler rollback --env staging`.
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: landing-deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

# bash with pipefail, so a failing wrangler before `| tee` fails the step.
defaults:
  run:
    shell: bash

env:
  WRANGLER: npx --yes wrangler@4.147.0

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only develop, mike and v* tags may use this environment, which holds the Cloudflare token.
    environment: cloudflare-deploy
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Build the landing
        run: node apps/landing/build.mjs --staging

      - name: Deploy
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: $WRANGLER deploy --env staging --message "$GITHUB_REF_NAME ${SHA::7}"

      - name: Smoke test
        env:
          URL: https://staging.moduo.app
        run: |
          set +e
          bun scripts/smoke-hosting.ts "$URL" --landing staging > "$RUNNER_TEMP/smoke.md"
          code=$?
          set -e
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/smoke.md"
          exit $code
