name: ai-review

# AI review of every PR into develop (HV-6, AC21): Claude runs the built-in `/code-review medium
# --comment` on Sonnet, where medium votes on each candidate finding before posting it inline (on
# Opus, medium is a single pass with no vote). Advisory only:
# the comments are advice for the founder merging the batch. The job is `continue-on-error`, it is
# not in checks.yml's `static-checks`, and it must never become a required check.
#
# Runs once per PR (opened, reopened, marked ready), not on every push, so a sync PR isn't reviewed
# again for each fix-up. Add the `ai-review` label to review the current head again.
#
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, on the Max plan) lives in the `ai-review`
# environment, never at repo level. Without it the job says so and passes. Forks never get it, and
# the job skips their PRs anyway. What the review flags and skips: REVIEW.md.
on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, ready_for_review, labeled]

# A new review replaces a running one. Any other label gets a group of its own, so labelling a PR
# never cancels its review.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ai-review') && github.run_id || 'review' }}
  cancel-in-progress: true

permissions:
  contents: read
  # Inline and top-level PR comments.
  pull-requests: write

jobs:
  review:
    # Same-repo PRs only, not drafts; a `labeled` event only for the re-review label.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review')
    runs-on: ubuntu-latest
    # Only for its secret: no deployment record on the PR.
    environment:
      name: ai-review
      deployment: false
    timeout-minutes: 30
    # Advisory: a failed or timed-out review step leaves the check green (step level). A checkout
    # failure, the job timeout or a cancel still shows red, which is harmless: it is never required.
    continue-on-error: true
    steps:
      - name: Token present
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set in the ai-review environment; skipping the review."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          # The whole history, so the review can diff against the base and read blame.
          fetch-depth: 0
          # The head, not the merge ref, so inline comments land on the lines GitHub shows.
          # Safe: forks are skipped above.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Review
        if: steps.token.outputs.ok == 'true'
        continue-on-error: true
        timeout-minutes: 25
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow token instead of the Claude GitHub App: nothing to install, and it has
          # only this workflow's permissions.
          github_token: ${{ github.token }}
          # Post each comment when made: buffered ones are lost if the step times out or is cancelled,
          # and the classifier needs an API key we don't have, so it would post them all anyway.
          classify_inline_comments: "false"
          prompt: /code-review medium --comment ${{ github.event.pull_request.number }}
          claude_args: |
            --model sonnet
            --max-turns 80
            --append-system-prompt "You review PR #${{ github.event.pull_request.number }} of ${{ github.repository }}, checked out in the working directory, for a founder about to merge it into develop. Read REVIEW.md first: it says what counts as Important, what to skip and how to cite evidence. Post each verified finding as an inline comment; post nothing else unless there are no findings, then one short top-level comment saying so. Never push, approve, request changes or edit files."
            --allowedTools "Read,Glob,Grep,Agent,Skill,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,NotebookEdit,Bash(gh api:*),Bash(bun:*),Bash(bunx:*),Bash(npm:*),Bash(npx:*),Bash(gh run:*),mcp__supabase,mcp__moduo"
