name: ai-review

# AI review of every PR into develop (HV-6, AC21): Claude runs the built-in `/code-review medium
# --comment` on Sonnet 5, where medium votes on each candidate finding before posting it inline.
# The exact id matters: Opus 5.5 and Sonnet 5.5 (the `sonnet` alias) fall to the default effort
# table, whose medium posts without a vote. Re-check this when bumping the action pin. Advisory only:
# the comments are advice for the founder merging the batch. The job is `continue-on-error`, it is
# not in checks.yml's `static-checks`, and it must never become a required check.
#
# Runs once per PR (opened, reopened, marked ready), not on every push, so a sync PR isn't reviewed
# again for each fix-up. Add the `ai-review` label to review the current head again.
#
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, on the Max plan) lives in the `ai-review`
# environment, never at repo level. Without it the job says so and passes. Forks never get it, and
# the job skips their PRs anyway. What the review flags and skips: REVIEW.md.
#
# Catching tests (HV-27, AC22), Tier 2 PRs only: Claude proposes rstest files that pass on the
# parent and fail on the PR head, as structured output, without running anything. A job with no
# secrets runs them on both commits (scripts/ci/catching-tests.ts), and a job that runs no repo
# code posts each catch as a PR comment. Advisory like the review: never a required check.
on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, ready_for_review, labeled]

# A new review replaces a running one. Any other label gets a group of its own, so labelling a PR
# never cancels its review.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ai-review') && github.run_id || 'review' }}
  cancel-in-progress: true

# Each job asks for what it needs.
permissions: {}

jobs:
  review:
    # Same-repo PRs only, not drafts; a `labeled` event only for the re-review label.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Inline and top-level PR comments.
      pull-requests: write
    # Only for its secret: no deployment record on the PR.
    environment:
      name: ai-review
      deployment: false
    timeout-minutes: 30
    # Advisory: a failed or timed-out review step leaves the check green (step level). A checkout
    # failure, the job timeout or a cancel still shows red, which is harmless: it is never required.
    continue-on-error: true
    steps:
      - name: Token present
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set in the ai-review environment; skipping the review."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          # The whole history, so the review can diff against the base and read blame.
          fetch-depth: 0
          # The head, not the merge ref, so inline comments land on the lines GitHub shows.
          # Safe: forks are skipped above.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Review
        if: steps.token.outputs.ok == 'true'
        continue-on-error: true
        timeout-minutes: 25
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow token instead of the Claude GitHub App: nothing to install, and it has
          # only this workflow's permissions.
          github_token: ${{ github.token }}
          # Post each comment when made: buffered ones are lost if the step times out or is cancelled,
          # and the classifier needs an API key we don't have, so it would post them all anyway.
          classify_inline_comments: "false"
          prompt: /code-review medium --comment ${{ github.event.pull_request.number }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 80
            --append-system-prompt "You review PR #${{ github.event.pull_request.number }} of ${{ github.repository }}, checked out in the working directory, for a founder about to merge it into develop. Read REVIEW.md first: it says what counts as Important, what to skip and how to cite evidence. Post each verified finding as an inline comment; post nothing else unless there are no findings, then one short top-level comment saying so. Never push, approve, request changes or edit files."
            --allowedTools "Read,Glob,Grep,Agent,Skill,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,NotebookEdit,Bash(gh api:*),Bash(bun:*),Bash(bunx:*),Bash(npm:*),Bash(npx:*),Bash(gh run:*),mcp__supabase,mcp__moduo"

  # The tier and the parent commit, from the base branch's classifier (as pr-tier.yml does), so
  # a PR can't opt out by loosening the list. No secrets.
  tier:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      parent: ${{ steps.tier.outputs.parent }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Classify
        id: tier
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$PR_BASE:scripts/ci/tier.ts" > "$RUNNER_TEMP/tier.ts"
          tier=$(bun "$RUNNER_TEMP/tier.ts" --range "$PR_BASE...$PR_HEAD" | head -n1)
          parent=$(git merge-base "$PR_BASE" "$PR_HEAD")
          case "$tier" in tier-0|tier-1|tier-2) ;; *) echo "Unexpected tier: $tier"; exit 1 ;; esac
          [[ "$parent" =~ ^[0-9a-f]{40}$ ]] || { echo "Unexpected merge base: $parent"; exit 1; }
          echo "$tier, parent $parent"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "parent=$parent" >> "$GITHUB_OUTPUT"

  # Claude reads the diff and proposes catching tests as structured output. It can't run, write
  # or post anything here: read-only tools, and a token that can only read contents.
  catching-tests:
    needs: tier
    if: needs.tier.outputs.tier == 'tier-2'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ai-review
      deployment: false
    timeout-minutes: 30
    continue-on-error: true
    outputs:
      tests: ${{ steps.propose.outputs.structured_output }}
    steps:
      - name: Token present
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set in the ai-review environment; skipping catching tests."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Propose
        id: propose
        if: steps.token.outputs.ok == 'true'
        continue-on-error: true
        timeout-minutes: 25
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You write catching tests for PR #${{ github.event.pull_request.number }} of ${{ github.repository }}, checked out at its head in the working directory. The parent commit is ${{ needs.tier.outputs.parent }}; `git diff ${{ needs.tier.outputs.parent }} HEAD` is the change.

            A catching test pins a behaviour the parent has and the PR changes: it passes on the parent and fails on the head, so the founder merging the PR sees exactly what it alters. You can't run anything. CI runs each test on both commits and posts only those that pass on the parent and fail on the head.

            1. Read the diff and pick at most 5 changed behaviours in TypeScript code that a unit test can reach with no network, database or real browser (jsdom is there). Prefer the Tier 2 paths listed in `scripts/ci/tier.ts` and changes that look unintended or risky.
            2. For each, read the parent's version (`git show ${{ needs.tier.outputs.parent }}:<file>`) and write one rstest file (`import { describe, expect, it } from "@rstest/core"`) asserting the parent's behaviour exactly where the PR changes it. Import the code under test by a path that exists in both commits.
            3. Name it `<folder of the code>/<name>.catching.test.ts` (`.tsx` for React), a path that exists in neither commit, inside a suite: `apps/app/src/` or `apps/app/edge/` (rules in `apps/app/rstest.config.ts`), the folders in `supabase/rstest.config.ts`, or those in `scripts/rstest.config.ts`. Read that config and a neighbouring test first, and mock the way they do.

            Write only tests you are confident pass on the parent. Return no tests when nothing is unit-testable (migrations, SQL, workflows, Rust, config), and say why in `note`. `behavior` is one or two plain sentences for the founder: what the parent does and what the PR does instead. Never push, comment or edit files.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --json-schema '{"type":"object","properties":{"tests":{"type":"array","maxItems":5,"items":{"type":"object","properties":{"path":{"type":"string"},"behavior":{"type":"string"},"code":{"type":"string"}},"required":["path","behavior","code"],"additionalProperties":false}},"note":{"type":"string"}},"required":["tests","note"],"additionalProperties":false}'
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --disallowedTools "Edit,Write,NotebookEdit,Agent,Bash(gh:*),Bash(bun:*),Bash(bunx:*),Bash(npm:*),Bash(npx:*),Bash(node:*),mcp__github_inline_comment__create_inline_comment,mcp__supabase,mcp__moduo"

  # Runs each proposal on the parent and on the head: PR code runs here, so this job has no
  # environment, no secrets and a token that can only read.
  catching-tests-run:
    needs: [tier, catching-tests]
    if: ${{ !cancelled() && needs.catching-tests.outputs.tests != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    continue-on-error: true
    outputs:
      caught: ${{ steps.run.outputs.caught }}
    env:
      PARENT: ${{ needs.tier.outputs.parent }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Rstest runs on Node, not Bun: pin it, or the runner's own decides.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Parent and head trees
        run: |
          git worktree add --detach "$RUNNER_TEMP/parent" "$PARENT"
          (cd "$RUNNER_TEMP/parent" && bun install --frozen-lockfile)
          bun install --frozen-lockfile

      - name: Run the proposals
        id: run
        env:
          TESTS: ${{ needs.catching-tests.outputs.tests }}
        run: |
          printf '%s' "$TESTS" > "$RUNNER_TEMP/proposals.json"
          bun scripts/ci/catching-tests.ts --tests "$RUNNER_TEMP/proposals.json" \
            --parent "$RUNNER_TEMP/parent" --head . --out "$RUNNER_TEMP/catching" \
            --parent-sha "$PARENT" --head-sha "$HEAD_SHA" | tee "$RUNNER_TEMP/run.log"
          grep -E '^caught=[0-9]+$' "$RUNNER_TEMP/run.log" | tail -n1 >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/catching/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the comments
        uses: actions/upload-artifact@v7
        with:
          name: catching-tests
          path: ${{ runner.temp }}/catching/comments/
          retention-days: 7

  # Posts each catch. No checkout and no repo code: it only reads the Markdown bodies.
  catching-tests-post:
    needs: catching-tests-run
    if: ${{ !cancelled() && needs.catching-tests-run.outputs.caught > 0 }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Fetch the comments
        uses: actions/download-artifact@v8
        with:
          name: catching-tests
          path: comments

      - name: Post
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          n=0
          for f in comments/*.md; do
            n=$((n + 1))
            [ "$n" -le 5 ] || break
            [ "$(wc -c < "$f")" -le 60000 ] || { echo "Skipping $f: too long"; continue; }
            gh pr comment "$PR" --repo "$REPO" --body-file "$f"
          done
