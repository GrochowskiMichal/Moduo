name: deploy-prod

# Redeploys a release tag's web app and landing (or mcp.moduo.app, target mcp) to production
# (specs/release-v2.md, REL-2). A release ships through release.yml when its vX.Y.Z tag is pushed
# (/ship); this is for re-runs: a deploy that failed half-way, a target deployed alone, or rolling
# forward again after a Cloudflare rollback. Same check as the release
# (scripts/release/check-tag.sh): the tag's commit is on develop, passed `checks`, and VERSION
# equals the tag. The deploys themselves are _deploy-web.yml and _deploy-mcp-proxy.yml.
#
# Manual, owner only. Production is tags only: Desktop Release (production) takes a tag too.
# Rollback: docs/release.md §4.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to redeploy (vX.Y.Z)
        required: true
      target:
        description: What to deploy
        type: choice
        # both = app + landing; mcp = mcp.moduo.app alone (_deploy-mcp-proxy.yml).
        options: [both, app, landing, mcp]
        default: both

# Shared with release.yml's web job: one production web deploy at a time.
concurrency:
  group: deploy-web-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      # Only the repo owner may publish production: the one who started the run and the one who
      # (re-)ran it. Fails loudly instead of skipping, so a refused run doesn't look green.
      - name: Owner only
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [ "$ACTOR" = "$OWNER" ] && [ "$TRIGGERING_ACTOR" = "$OWNER" ] \
            || { echo "::error::Only $OWNER may deploy production (actor $ACTOR, triggered by $TRIGGERING_ACTOR)."; exit 1; }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: bash scripts/release/check-tag.sh "$TAG"

  web:
    needs: resolve
    if: inputs.target != 'mcp'
    uses: ./.github/workflows/_deploy-web.yml
    # inherit is required for the called jobs to see their environment's secrets (an explicit
    # list leaves them empty); the sensitive ones live only in those environments.
    secrets: inherit
    with:
      sha: ${{ needs.resolve.outputs.sha }}
      label: ${{ inputs.tag }}
      target: ${{ inputs.target }}

  mcp:
    needs: resolve
    if: inputs.target == 'mcp'
    # Shared with release.yml's mcp job.
    concurrency:
      group: deploy-mcp-production
      cancel-in-progress: false
    uses: ./.github/workflows/_deploy-mcp-proxy.yml
    secrets: inherit
    with:
      sha: ${{ needs.resolve.outputs.sha }}
      label: ${{ inputs.tag }}
