name: Desktop Release (staging)

# Runs when src-tauri changes land on develop, nightly at 02:00 UTC, or on demand.
# Builds signed Mac universal .dmg + Windows NSIS installer.
# Artifacts are uploaded to a rolling GitHub Release tagged `staging-latest`.
#
# Required secrets (GitHub → Settings → Secrets → Actions):
#   APPLE_CERTIFICATE             base64-encoded p12 Developer ID Application certificate
#   APPLE_CERTIFICATE_PASSWORD    p12 password
#   APPLE_SIGNING_IDENTITY        "Developer ID Application: <Name> (<TeamID>)"
#   APPLE_TEAM_ID                 10-character Apple team id
#   APPLE_ID                      Apple ID email used for notarization
#   APPLE_ID_PASSWORD             App-specific password for that Apple ID
#   TAURI_SIGNING_PRIVATE_KEY     private key from `bunx tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  key password (empty string if none)
#   MODUO_KEYCHAIN_SERVICE        value for the keychain service name in the app
#   MODUO_TOKEN_ENCRYPTION_SECRET token encryption secret
#   MODUO_GOOGLE_MEET_CLIENT_ID   Google Meet OAuth client id
#   MODUO_GOOGLE_MEET_CLIENT_SECRET
#   MODUO_CALENDAR_GOOGLE_CLIENT_ID
#   MODUO_CALENDAR_GOOGLE_CLIENT_SECRET
#   PUBLIC_SUPABASE_URL           Supabase project URL
#   PUBLIC_SUPABASE_PUBLISHABLE_KEY
#   PUBLIC_STRIPE_PUBLISHABLE_KEY
#   PUBLIC_STRIPE_PRICE_PRO_MONTHLY
#   PUBLIC_STRIPE_PRICE_PRO_YEARLY
#   PUBLIC_STRIPE_PRICE_TEAM_MONTHLY
#   PUBLIC_STRIPE_PRICE_TEAM_YEARLY

on:
  workflow_dispatch:
  schedule:
    # Nightly at 02:00 UTC so a fresh install is never weeks behind on UI-only days
    - cron: "0 2 * * *"
  push:
    branches:
      - develop
    paths:
      - "src-tauri/**"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # macOS — universal binary (Apple Silicon + Intel), signed + notarised
  # ─────────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      MODUO_BUILD: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (stable + both Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # GitHub's macOS image already has stable for Apple Silicon. `toolchain install
      # --target` then no-ops and never adds the Intel stdlib, so universal builds fail.
      - name: Ensure Intel macOS target is installed
        run: |
          rustup target add x86_64-apple-darwin
          rustup target list --installed | grep -qx x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      # Import the Developer ID cert into an ephemeral keychain so codesign can find it
      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security import /tmp/cert.p12 -k $KEYCHAIN -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN
          rm /tmp/cert.p12

      - name: Build universal macOS .dmg (signed)
        run: bunx tauri build --target universal-apple-darwin --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MODUO_KEYCHAIN_SERVICE: ${{ secrets.MODUO_KEYCHAIN_SERVICE }}
          MODUO_TOKEN_ENCRYPTION_SECRET: ${{ secrets.MODUO_TOKEN_ENCRYPTION_SECRET }}
          MODUO_GOOGLE_MEET_CLIENT_ID: ${{ secrets.MODUO_GOOGLE_MEET_CLIENT_ID }}
          MODUO_GOOGLE_MEET_CLIENT_SECRET: ${{ secrets.MODUO_GOOGLE_MEET_CLIENT_SECRET }}
          MODUO_CALENDAR_GOOGLE_CLIENT_ID: ${{ secrets.MODUO_CALENDAR_GOOGLE_CLIENT_ID }}
          MODUO_CALENDAR_GOOGLE_CLIENT_SECRET: ${{ secrets.MODUO_CALENDAR_GOOGLE_CLIENT_SECRET }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.PUBLIC_STRIPE_PRICE_PRO_MONTHLY }}
          PUBLIC_STRIPE_PRICE_PRO_YEARLY: ${{ secrets.PUBLIC_STRIPE_PRICE_PRO_YEARLY }}
          PUBLIC_STRIPE_PRICE_TEAM_MONTHLY: ${{ secrets.PUBLIC_STRIPE_PRICE_TEAM_MONTHLY }}
          PUBLIC_STRIPE_PRICE_TEAM_YEARLY: ${{ secrets.PUBLIC_STRIPE_PRICE_TEAM_YEARLY }}
          PUBLIC_WEB_ORIGIN: "https://app.staging.moduo.app"
          PUBLIC_STAGING_PORTAL: "true"

      - name: Notarise the .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          echo "Notarizing: $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      # Rename to stable filename so download URLs don't change between versions
      - name: Rename artifacts to stable filenames
        run: |
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          cp "$DMG" /tmp/Moduo_universal.dmg
          # Copy the updater signature file
          SIG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg.sig" | head -1)
          if [ -f "$SIG" ]; then cp "$SIG" /tmp/Moduo_universal.dmg.sig; fi

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            /tmp/Moduo_universal.dmg
            /tmp/Moduo_universal.dmg.sig

  # ─────────────────────────────────────────────────────────────────
  # Windows — NSIS installer (unsigned; SmartScreen "Run anyway" for founders)
  # ─────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      MODUO_BUILD: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build Windows NSIS installer
        run: bunx tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MODUO_KEYCHAIN_SERVICE: ${{ secrets.MODUO_KEYCHAIN_SERVICE }}
          MODUO_TOKEN_ENCRYPTION_SECRET: ${{ secrets.MODUO_TOKEN_ENCRYPTION_SECRET }}
          MODUO_GOOGLE_MEET_CLIENT_ID: ${{ secrets.MODUO_GOOGLE_MEET_CLIENT_ID }}
          MODUO_GOOGLE_MEET_CLIENT_SECRET: ${{ secrets.MODUO_GOOGLE_MEET_CLIENT_SECRET }}
          MODUO_CALENDAR_GOOGLE_CLIENT_ID: ${{ secrets.MODUO_CALENDAR_GOOGLE_CLIENT_ID }}
          MODUO_CALENDAR_GOOGLE_CLIENT_SECRET: ${{ secrets.MODUO_CALENDAR_GOOGLE_CLIENT_SECRET }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.PUBLIC_STRIPE_PRICE_PRO_MONTHLY }}
          PUBLIC_STRIPE_PRICE_PRO_YEARLY: ${{ secrets.PUBLIC_STRIPE_PRICE_PRO_YEARLY }}
          PUBLIC_STRIPE_PRICE_TEAM_MONTHLY: ${{ secrets.PUBLIC_STRIPE_PRICE_TEAM_MONTHLY }}
          PUBLIC_STRIPE_PRICE_TEAM_YEARLY: ${{ secrets.PUBLIC_STRIPE_PRICE_TEAM_YEARLY }}
          PUBLIC_WEB_ORIGIN: "https://app.staging.moduo.app"
          PUBLIC_STAGING_PORTAL: "true"

      # Rename to stable filename
      - name: Rename artifacts to stable filenames
        shell: bash
        run: |
          NSIS=$(find src-tauri/target/release/bundle/nsis -name "*-setup.exe" | head -1)
          cp "$NSIS" /tmp/Moduo_x64-setup.exe
          SIG=$(find src-tauri/target/release/bundle/nsis -name "*-setup.exe.sig" | head -1)
          if [ -f "$SIG" ]; then cp "$SIG" /tmp/Moduo_x64-setup.exe.sig; fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: |
            /tmp/Moduo_x64-setup.exe
            /tmp/Moduo_x64-setup.exe.sig

  # ─────────────────────────────────────────────────────────────────
  # Publish — combine artifacts and update the rolling `staging-latest` release
  # ─────────────────────────────────────────────────────────────────
  publish:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: release-artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: release-artifacts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Build latest.json for the Tauri in-app updater
      - name: Generate latest.json
        id: gen_manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat src-tauri/tauri.conf.json | grep '"version"' | head -1 | sed 's/.*"\([0-9.]*\)".*/\1/')
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="GrochowskiMichal/moduohyb"
          BASE_URL="https://github.com/${REPO}/releases/download/staging-latest"

          MAC_SIG=""
          WIN_SIG=""
          if [ -f release-artifacts/Moduo_universal.dmg.sig ]; then
            MAC_SIG=$(cat release-artifacts/Moduo_universal.dmg.sig)
          fi
          if [ -f release-artifacts/Moduo_x64-setup.exe.sig ]; then
            WIN_SIG=$(cat release-artifacts/Moduo_x64-setup.exe.sig)
          fi

          cat > release-artifacts/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Staging build from commit ${{ github.sha }}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MAC_SIG}",
                "url": "${BASE_URL}/Moduo_universal.dmg"
              },
              "darwin-x86_64": {
                "signature": "${MAC_SIG}",
                "url": "${BASE_URL}/Moduo_universal.dmg"
              },
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${BASE_URL}/Moduo_x64-setup.exe"
              }
            }
          }
          EOF

          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Upsert rolling staging-latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          name: "Staging — latest build"
          prerelease: true
          body: |
            Rolling staging release — always points at the latest build from `develop`.

            **Commit:** ${{ github.sha }}
            **Built:** ${{ github.run_id }}

            Download the desktop app or let the in-app updater install it automatically.
          files: |
            release-artifacts/Moduo_universal.dmg
            release-artifacts/Moduo_x64-setup.exe
            release-artifacts/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
