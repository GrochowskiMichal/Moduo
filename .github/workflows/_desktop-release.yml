name: Desktop Release (shared)

# The one desktop build both channels call (desktop-release.yml = staging, desktop-release-prod.yml = production).
# Builds a signed, notarised Mac universal .dmg + Windows NSIS installer and publishes them, with
# a manifest for the in-app updater, to two places:
#   1. R2 bucket moduo-releases, served by the update server (infra/update-server): every file under
#      desktop/<channel>/<version>/, never overwritten, then the channel's latest.json last.
#   2. The rolling GitHub release in GrochowskiMichal/moduo-releases, but only up to the bridge.
#      Builds before PLAT-6 only know that address. The first release from this workflow on a
#      channel is that channel's bridge: its GitHub latest.json carries "bridge": true, and later
#      releases leave the GitHub release alone, so old installs land on the bridge and go no
#      further there. Everything after the bridge reaches installs through the update server
#      alone, where the rollout share and the kill switch apply (desktop-rollout.yml).
# Builds list the update server at https://updates.moduo.app first, the same Worker at its
# workers.dev address second, and GitHub third. The updater tries the next one on any error or
# non-2xx answer; both server addresses read the same KV, and a frozen GitHub manifest offers
# nothing newer than the bridge, so no fallback can route around the kill switch (a 204 stops the
# check). The address is the repo variable UPDATE_SERVER_URL (default below). Builds from rc.43 to
# PLAT-8 have only the workers.dev address, so that address must keep working (workers_dev stays on).
# The fallback covers the update check only: the manifest's download URLs use UPDATE_SERVER_URL.
# To re-issue a bridge (a broken bridge build), delete latest.json from the channel's GitHub release.
#
# Mac notarization is one Apple submission (the .dmg; Apple notarises the .app inside it too).
# build-mac waits for Apple for a while; if Apple is slower than that, notarize-mac keeps waiting on
# the same submission on its own, and "Re-run failed jobs" there never rebuilds or resubmits.
# Windows is best-effort: a broken Windows build still publishes the Mac release.
#
# The Mac build runs on Mike's Mac (self-hosted runner `moduo-mac`, set up by infra/mac-runner)
# when it is online and idle, and on GitHub's macos-latest otherwise; `pick-runner` decides in
# seconds and never waits. Only a push to develop/mike, a v* tag or the owner's manual run may use
# the Mac (never pull_request or the nightly schedule); the Mac's own job-started hook refuses
# anything else too. A re-run always builds on GitHub, and mac-watchdog cancels a run whose Mac
# build hasn't started within 6 minutes. On the Mac the job signs and notarizes with that runner's own keychain
# (MODUO_SIGNING_KEYCHAIN, a notarytool profile) instead of importing APPLE_CERTIFICATE, keeps its
# Cargo target dir between runs (CARGO_TARGET_DIR) and skips the GitHub Rust cache. The
# GitHub-hosted path is unchanged. notarize-mac (only when Apple is slow) always runs on GitHub.
#
# Required secrets (GitHub → Settings → Secrets → Actions), passed with `secrets: inherit`:
#   APPLE_CERTIFICATE             base64-encoded p12 Developer ID Application certificate
#   APPLE_CERTIFICATE_PASSWORD    p12 password
#   APPLE_SIGNING_IDENTITY        "Developer ID Application: <Name> (<TeamID>)"
#   APPLE_TEAM_ID                 10-character Apple team id
#   APPLE_ID                      Apple ID email used for notarization
#   APPLE_ID_PASSWORD             App-specific password for that Apple ID
#   (optional, preferred) APPLE_API_KEY_ID / APPLE_API_ISSUER / APPLE_API_KEY_P8 — an App Store Connect
#                                 API key; used for notarization instead of the Apple ID when all three are set
#   RELEASES_REPO_TOKEN           fine-grained PAT, contents:write on GrochowskiMichal/moduo-releases
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  R2 upload (Workers R2 Storage: Edit)
#   RUNNER_STATUS_TOKEN           fine-grained PAT, Administration: read on this repo (lists runners for
#                                 pick-runner); unset → always GitHub-hosted
#   TAURI_SIGNING_PRIVATE_KEY     private key from `bunx tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  key password (empty string if none)
#   PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_PUBLISHABLE_KEY,
#   PUBLIC_STRIPE_PUBLISHABLE_KEY, PUBLIC_STRIPE_PRICE_{PRO,TEAM}_{MONTHLY,YEARLY}
# (The Rust shell reads MODUO_* settings such as the Google OAuth clients at run time, not at
# build time, so passing them to `tauri build` did nothing; they are not passed any more.)
#
# Version: the built branch's VERSION file (scripts/release/version.mjs). Production ships it as is,
# staging as <VERSION>-rc.<run number>. The updater only installs a higher version, so the
# `version` job fails the release up front when VERSION isn't newer than what the channel published
# (on GitHub or on the update server), or when the update server already has that version.

on:
  workflow_call:
    inputs:
      channel:
        description: "staging | production"
        required: true
        type: string
      ref:
        description: "Branch or tag to build, e.g. refs/tags/v1.2.0 (empty = the commit that triggered the run)"
        required: false
        type: string
        default: ""
      release_tag:
        required: true
        type: string
      release_name:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
      web_origin:
        required: true
        type: string
      staging_portal:
        description: "Sets PUBLIC_STAGING_PORTAL=true (the STAGING badge) in the web bundle"
        required: false
        type: boolean
        default: false
      desktop_channel:
        description: "PUBLIC_DESKTOP_CHANNEL for the web bundle"
        required: false
        type: string
        default: ""
    outputs:
      published:
        description: "true once the update server offers this build (a failed Windows build still turns the run red)"
        value: ${{ jobs.publish.outputs.published }}

# Jobs get read access only; mac-watchdog alone asks for actions: write (callers grant it).
permissions:
  contents: read

env:
  RELEASES_REPO: GrochowskiMichal/moduo-releases
  UPDATE_SERVER_URL: ${{ vars.UPDATE_SERVER_URL || 'https://updates.moduo.app' }}
  UPDATE_SERVER_FALLBACK_URL: https://moduo-update-server.moduo.workers.dev

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Version — one value for every job, checked against the channel's published latest.json
  # ─────────────────────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      github_frozen: ${{ steps.version.outputs.github_frozen }}
      # The commit being built (inputs.ref, e.g. a release tag), not github.sha: that is the commit
      # the workflow file came from, which differs when a channel builds another branch.
      # Build jobs check out build_sha, so a branch that moves mid-run (or a later "Re-run failed
      # jobs") still builds and labels the same tree. `build` is its 7-character form, shown in
      # About and the update notes, the same as the web builds.
      build_sha: ${{ steps.sha.outputs.sha }}
      build: ${{ steps.sha.outputs.short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false

      - name: Record the commit being built
        id: sha
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Building \`${SHA::7}\` ($(git log -1 --format=%s HEAD))" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout CI scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci
          sparse-checkout: scripts

      - name: Compute the version and check it is newer than the published one
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::The built branch has no VERSION file yet. Merge (or promote) the release-version change into it first."
            exit 1
          fi
          cp VERSION .ci/VERSION
          VERSION="$(node .ci/scripts/release/version.mjs desktop "$CHANNEL" "$RUN_NUMBER")"
          # Only a 404 means "nothing published yet"; any other failure must not skip the check.
          STATUS="$(curl -sL -o latest.json -w '%{http_code}' "https://github.com/${RELEASES_REPO}/releases/download/${RELEASE_TAG}/latest.json")"
          FROZEN=false
          case "$STATUS" in
            200) PUBLISHED="$(jq -r '.version // empty' latest.json)"
                 [ "$(jq -r '.bridge // false' latest.json)" = true ] && FROZEN=true ;;
            404) PUBLISHED="" ;;
            *) echo "::error::Could not read the published latest.json (HTTP $STATUS). Re-run the job."; exit 1 ;;
          esac
          node .ci/scripts/release/version.mjs assert-newer "$VERSION" "$PUBLISHED"
          # The update server's copy. Until its first publish it answers 404 (nothing yet). A 404 only
          # means that when the Worker itself is up (Cloudflare answers 404 for a missing Worker too).
          curl -sSf "$UPDATE_SERVER_URL/health" >/dev/null || { echo "::error::The update server at $UPDATE_SERVER_URL is not answering /health. Deploy it (update-server workflow) or re-run."; exit 1; }
          STATUS="$(curl -sL -o r2-latest.json -w '%{http_code}' "$UPDATE_SERVER_URL/desktop/$CHANNEL/latest.json")"
          case "$STATUS" in
            200) R2_PUBLISHED="$(jq -r '.version // empty' r2-latest.json)" ;;
            404) R2_PUBLISHED="" ;;
            *) echo "::error::Could not read the update server's latest.json (HTTP $STATUS). Re-run the job."; exit 1 ;;
          esac
          node .ci/scripts/release/version.mjs assert-newer "$VERSION" "$R2_PUBLISHED"
          # Versioned paths are never overwritten: a version whose manifest exists is sealed.
          STATUS="$(curl -s -o /dev/null -I -w '%{http_code}' "$UPDATE_SERVER_URL/download/desktop/$CHANNEL/$VERSION/latest.json")"
          if [ "$STATUS" != 404 ]; then
            echo "::error::The update server already has $CHANNEL $VERSION (HTTP $STATUS), or can't say. Bump VERSION, or re-run if it was a network error."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "github_frozen=$FROZEN" >> "$GITHUB_OUTPUT"
          if [ "$FROZEN" = true ]; then
            echo "GitHub release \`$RELEASE_TAG\` holds the bridge ($PUBLISHED) and is left alone." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "This release is the channel's bridge: the GitHub release gets it, then freezes." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Version: \`$VERSION\` (published: GitHub \`${PUBLISHED:-none}\`, update server \`${R2_PUBLISHED:-none}\`)" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────
  # Which Mac builds: Mike's (moduo-mac) when it may and is online and idle, else GitHub's.
  # Any doubt (no token, API error, timeout) means GitHub's, so a release never waits on the Mac.
  # ─────────────────────────────────────────────────────────────────
  pick-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      self_hosted: ${{ steps.pick.outputs.self_hosted }}

    steps:
      - name: Pick the Mac runner
        id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          pick() {
            if [ "$1" = mac ]; then
              echo 'runner=["self-hosted","macOS","ARM64","moduo-mac"]' >> "$GITHUB_OUTPUT"
              echo "self_hosted=true" >> "$GITHUB_OUTPUT"
            else
              echo 'runner="macos-latest"' >> "$GITHUB_OUTPUT"
              echo "self_hosted=false" >> "$GITHUB_OUTPUT"
            fi
            echo "Mac build runner: **$1** ($2)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ "$GITHUB_RUN_ATTEMPT" = 1 ] || pick macos-latest "re-run $GITHUB_RUN_ATTEMPT builds on GitHub"
          # Who may use the Mac (AC13). The Mac's job-started hook enforces the same rules.
          case "$EVENT:$REF" in
            push:refs/heads/develop | push:refs/heads/mike | push:refs/tags/v*) ;;
            workflow_dispatch:*) [ "$ACTOR" = "$OWNER" ] || pick macos-latest "manual run by $ACTOR, not the owner" ;;
            *) pick macos-latest "$EVENT on $REF never uses the Mac" ;;
          esac
          [ -n "$GH_TOKEN" ] || pick macos-latest "RUNNER_STATUS_TOKEN is not set"
          # Online and not running a job, with all four labels (runs-on labels are case-insensitive).
          # shellcheck disable=SC2016 # $l and $x are jq variables
          if ! idle="$(timeout 30 gh api "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" --jq '
              [.runners[] | select(.status == "online" and .busy == false)
               | select([.labels[].name | ascii_downcase] as $l
                        | ["self-hosted", "macos", "arm64", "moduo-mac"] | all(. as $x | $l | index($x)))]
              | length')"; then
            echo "::warning::Could not read the runner list; using GitHub-hosted macOS."
            pick macos-latest "runner status unavailable"
          fi
          if [ "$idle" -gt 0 ]; then pick mac "moduo-mac is online and idle"; fi
          pick macos-latest "moduo-mac is offline or busy"

  # ─────────────────────────────────────────────────────────────────
  # The Mac can fall asleep (or get another run's build) between pick-runner and the job, and a
  # self-hosted job then queues for up to a day. If build-mac hasn't started within 6 minutes, cancel
  # the run; a re-run builds on GitHub's Mac (see build-mac's runs-on).
  # ─────────────────────────────────────────────────────────────────
  mac-watchdog:
    # After version too, so a slow version job doesn't eat the watchdog's window.
    needs: [version, pick-runner]
    if: needs.pick-runner.outputs.self_hosted == 'true' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write
    steps:
      - name: Wait for moduo-mac to start build-mac
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 36); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | test("build-mac$")) | .status] | first // "pending"' || echo pending)"
            case "$status" in
              in_progress | completed) echo "build-mac is $status."; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::moduo-mac didn't start build-mac within 6 minutes (asleep or busy). Cancelling; use Re-run failed jobs and it builds on GitHub's Mac (on a release run, Re-run all jobs would deploy web again)."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          exit 1

  # ─────────────────────────────────────────────────────────────────
  # macOS — universal binary (Apple Silicon + Intel), signed, submitted to Apple
  # ─────────────────────────────────────────────────────────────────
  build-mac:
    needs: [version, pick-runner]
    # Any re-run (all jobs or failed ones) builds on GitHub: "Re-run failed jobs" reuses pick-runner's
    # old answer, and the Mac that failed or never answered is the likely reason for the re-run.
    runs-on: ${{ fromJSON(github.run_attempt == '1' && needs.pick-runner.outputs.runner || '"macos-latest"') }}
    timeout-minutes: 60
    env:
      MODUO_VERSION: ${{ needs.version.outputs.version }}
      MODUO_BUILD: ${{ needs.version.outputs.build }}
    outputs:
      notary_id: ${{ steps.submit.outputs.id }}
      stapled: ${{ steps.wait.outputs.stapled }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.build_sha }}

      # CI scripts come from the workflow's own commit, so a build of an older branch
      # (prod-app before a promote) still gets the current signing/notarization logic.
      - name: Checkout CI scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci
          sparse-checkout: scripts

      - name: Runner
        run: echo "Mac build on \`$RUNNER_NAME\` ($RUNNER_ENVIRONMENT)" | tee -a "$GITHUB_STEP_SUMMARY"

      # moduo-mac only: its own keychain already holds the Developer ID identity and the notarization
      # login (infra/mac-runner/setup.sh). Unlock it, make it the job's keychain, and run the same
      # checks as the import step below, which the Mac skips.
      - name: Use the runner's signing keychain
        if: runner.environment == 'self-hosted'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="${MODUO_SIGNING_KEYCHAIN:?not a moduo-mac runner: MODUO_SIGNING_KEYCHAIN is unset}"
          KEYCHAIN_PASSWORD="$(cat "$HOME/.moduo-ci/keychain-password")"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
          {
            echo "BUILD_KEYCHAIN=$KEYCHAIN"
            echo "NOTARY_KEYCHAIN=$KEYCHAIN"
            echo "NOTARY_KEYCHAIN_PROFILE=${MODUO_NOTARY_PROFILE:-moduo-notary}"
          } >> "$GITHUB_ENV"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -qF "$APPLE_SIGNING_IDENTITY"; then
            security find-identity -v -p codesigning "$KEYCHAIN"
            echo "::error::The runner's keychain has no identity named APPLE_SIGNING_IDENTITY. Re-run infra/mac-runner/setup.sh --reimport-cert on the Mac."
            exit 1
          fi
          cp /usr/bin/true "$RUNNER_TEMP/sign-probe"
          if ! perl -e 'alarm 90; exec @ARGV' codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KEYCHAIN" "$RUNNER_TEMP/sign-probe"; then
            echo "::error::codesign could not use the runner's keychain without a prompt (or timed out reaching Apple's timestamp server)."
            exit 1
          fi

      # Seconds, before any compile: a bad Apple login used to surface only after the build.
      - name: Check Apple notarization login
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash .ci/scripts/ci-macos-notarize.sh check

      # Import the Developer ID cert into an ephemeral keychain and prove codesign can see it.
      - name: Import Apple Developer ID certificate
        if: runner.environment != 'self-hosted'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Never auto-lock mid-build (the default 5-minute lock breaks codesign with errSecInternalComponent).
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          echo "BUILD_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -qF "$APPLE_SIGNING_IDENTITY"; then
            security find-identity -v -p codesigning "$KEYCHAIN"
            echo "::error::APPLE_SIGNING_IDENTITY is not a valid signing identity in APPLE_CERTIFICATE (expired cert, wrong p12, or name mismatch)."
            exit 1
          fi
          # Sign a throwaway binary with a 90s cap. If codesign would wait on a keychain prompt nobody can
          # click, this fails now instead of hanging the real signing step for hours.
          cp /usr/bin/true "$RUNNER_TEMP/sign-probe"
          if ! perl -e 'alarm 90; exec @ARGV' codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KEYCHAIN" "$RUNNER_TEMP/sign-probe"; then
            echo "::error::codesign could not use the certificate without a prompt (or timed out reaching Apple's timestamp server)."
            exit 1
          fi

      # PLAT-2 moved the Tauri app to apps/desktop. A branch cut before the move (prod-app until the
      # next promote) still has it at the root, so find it instead of assuming either layout.
      - name: Locate the desktop app
        run: |
          if [ -f apps/desktop/src-tauri/tauri.conf.json ]; then DIR=apps/desktop; else DIR=.; fi
          echo "DESKTOP_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Desktop app: $DIR"

      - name: Read Rust toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$DESKTOP_DIR/src-tauri/rust-toolchain.toml")" >> "$GITHUB_OUTPUT"

      # Same channel as the app's src-tauri/rust-toolchain.toml, so the targets land on the toolchain cargo uses.
      - name: Setup Rust (+ both Apple targets)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Saved even when a later step fails, so a signing/notarization failure doesn't force a cold compile next time.
      # moduo-mac keeps its own target dir (CARGO_TARGET_DIR) and needs no copy of it.
      - name: Cache Rust dependencies
        if: runner.environment != 'self-hosted'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ env.DESKTOP_DIR }}/src-tauri
          shared-key: desktop-mac
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .ci/.bun-version

      # The Tauri CLI (bunx tauri) runs on Node. GitHub's Macs ship it; moduo-mac doesn't.
      - name: Setup Node (moduo-mac)
        if: runner.environment == 'self-hosted'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      # Stamp the release version (the updater only offers builds newer than the installed one),
      # turn on signed updater bundles, and point this channel's updater at the update server first
      # (its domain, then workers.dev) and the GitHub releases repo last (the fallback while the
      # bridge lasts).
      - name: Write CI Tauri config
        run: |
          cat > "$RUNNER_TEMP/ci-tauri-config.json" <<EOF
          {
            "version": "${MODUO_VERSION}",
            "bundle": { "createUpdaterArtifacts": true },
            "plugins": { "updater": { "endpoints": ["${UPDATE_SERVER_URL}/desktop/${{ inputs.channel }}/{{target}}/{{arch}}/{{current_version}}", "${UPDATE_SERVER_FALLBACK_URL}/desktop/${{ inputs.channel }}/{{target}}/{{arch}}/{{current_version}}", "https://github.com/${RELEASES_REPO}/releases/download/${{ inputs.release_tag }}/latest.json"] } }
          }
          EOF

      # The persistent target dir still holds earlier versions' bundles; staging picks the first .dmg it finds.
      - name: Clear old bundles (moduo-mac)
        if: runner.environment == 'self-hosted'
        run: rm -rf "${CARGO_TARGET_DIR:?}/universal-apple-darwin/release/bundle"

      # No APPLE_ID / APPLE_PASSWORD here on purpose: Tauri would notarize the .app and block on Apple,
      # and the .dmg submission below covers the .app too. No APPLE_CERTIFICATE either: Tauri would import
      # a second copy into its own keychain, and codesign hung there for 1.5 h (run 37636171897).
      - name: Build universal macOS .dmg + updater bundle (signed)
        run: |
          KEY="$(bash .ci/scripts/ci-normalize-updater-key.sh)"
          echo "::add-mask::$KEY"
          export TAURI_SIGNING_PRIVATE_KEY="$KEY"
          cd "$DESKTOP_DIR"
          bunx tauri build --target universal-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/ci-tauri-config.json"
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.PUBLIC_STRIPE_PRICE_PRO_MONTHLY }}
          PUBLIC_STRIPE_PRICE_PRO_YEARLY: ${{ secrets.PUBLIC_STRIPE_PRICE_PRO_YEARLY }}
          PUBLIC_STRIPE_PRICE_TEAM_MONTHLY: ${{ secrets.PUBLIC_STRIPE_PRICE_TEAM_MONTHLY }}
          PUBLIC_STRIPE_PRICE_TEAM_YEARLY: ${{ secrets.PUBLIC_STRIPE_PRICE_TEAM_YEARLY }}
          PUBLIC_WEB_ORIGIN: ${{ inputs.web_origin }}
          PUBLIC_STAGING_PORTAL: ${{ inputs.staging_portal && 'true' || '' }}
          PUBLIC_DESKTOP_CHANNEL: ${{ inputs.desktop_channel }}

      # Stable filenames so download URLs don't change between versions. The macOS updater
      # installs the .app.tar.gz, not the .dmg.
      - name: Verify signatures and stage artifacts
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          BUNDLE="${CARGO_TARGET_DIR:-$DESKTOP_DIR/src-tauri/target}/universal-apple-darwin/release/bundle"
          APP=$(find "$BUNDLE/macos" -maxdepth 1 -name "*.app" | head -1)
          DMG=$(find "$BUNDLE/dmg" -name "*.dmg" | head -1)
          TGZ=$(find "$BUNDLE/macos" -name "*.app.tar.gz" | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -q "flags=.*runtime" || { echo "::error::The app is not signed with the hardened runtime; Apple will reject it."; exit 1; }
          if ! codesign --verify "$DMG" 2>/dev/null; then
            codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" --keychain "$BUILD_KEYCHAIN" "$DMG"
          fi
          mkdir -p "$RUNNER_TEMP/mac"
          cp "$DMG" "$RUNNER_TEMP/mac/Moduo_universal.dmg"
          cp "$TGZ" "$RUNNER_TEMP/mac/Moduo_universal.app.tar.gz"
          cp "$TGZ.sig" "$RUNNER_TEMP/mac/Moduo_universal.app.tar.gz.sig"

      - name: Submit the .dmg to Apple
        id: submit
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          ID=$(bash .ci/scripts/ci-macos-notarize.sh submit "$RUNNER_TEMP/mac/Moduo_universal.dmg")
          echo "$ID" > "$RUNNER_TEMP/mac/notary-id.txt"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Apple notarization submission: \`$ID\`" >> "$GITHUB_STEP_SUMMARY"

      # Most submissions finish in a few minutes. A slower one is handed to notarize-mac.
      - name: Wait for Apple (up to 20 min) and staple
        id: wait
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          NOTARY_WAIT_TIMEOUT: 20m
        run: |
          set +e
          bash .ci/scripts/ci-macos-notarize.sh wait "${{ steps.submit.outputs.id }}" "$RUNNER_TEMP/mac/Moduo_universal.dmg"
          code=$?
          set -e
          case $code in
            0) echo "stapled=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "stapled=false" >> "$GITHUB_OUTPUT"
               echo "Apple is still processing; notarize-mac keeps waiting on the same submission." >> "$GITHUB_STEP_SUMMARY" ;;
            *) exit "$code" ;;
          esac

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac-dmg
          if-no-files-found: error
          path: ${{ runner.temp }}/mac/*

  # ─────────────────────────────────────────────────────────────────
  # macOS — only when Apple was slower than build-mac's wait. Waits on the same
  # submission; re-running this job never rebuilds or resubmits.
  # ─────────────────────────────────────────────────────────────────
  notarize-mac:
    needs: build-mac
    if: needs.build-mac.outputs.stapled == 'false'
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts

      - name: Download Mac artifacts
        uses: actions/download-artifact@v8
        with:
          name: mac-dmg
          path: mac

      - name: Wait for Apple (up to 160 min) and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          NOTARY_WAIT_TIMEOUT: 160m
        run: |
          set +e
          bash scripts/ci-macos-notarize.sh wait "$(cat mac/notary-id.txt)" mac/Moduo_universal.dmg
          code=$?
          set -e
          if [ "$code" = 3 ]; then
            echo "::error::Apple still hasn't finished. Use \"Re-run failed jobs\" — it waits on the same submission without rebuilding."
          fi
          exit "$code"

      - name: Upload stapled Mac artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac-dmg
          overwrite: true
          if-no-files-found: error
          path: mac/*

  # ─────────────────────────────────────────────────────────────────
  # Windows — NSIS installer (unsigned; SmartScreen "Run anyway" for founders)
  # ─────────────────────────────────────────────────────────────────
  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MODUO_VERSION: ${{ needs.version.outputs.version }}
      MODUO_BUILD: ${{ needs.version.outputs.build }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.build_sha }}

      - name: Checkout CI scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci
          sparse-checkout: scripts

      # PLAT-2 moved the Tauri app to apps/desktop. A branch cut before the move (prod-app until the
      # next promote) still has it at the root, so find it instead of assuming either layout.
      - name: Locate the desktop app
        run: |
          if [ -f apps/desktop/src-tauri/tauri.conf.json ]; then DIR=apps/desktop; else DIR=.; fi
          echo "DESKTOP_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Desktop app: $DIR"

      - name: Read Rust toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$DESKTOP_DIR/src-tauri/rust-toolchain.toml")" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ env.DESKTOP_DIR }}/src-tauri
          shared-key: desktop-windows
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .ci/.bun-version

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Write CI Tauri config
        run: |
          cat > ci-tauri-config.json <<EOF
          {
            "version": "${MODUO_VERSION}",
            "bundle": { "createUpdaterArtifacts": true },
            "plugins": { "updater": { "endpoints": ["${UPDATE_SERVER_URL}/desktop/${{ inputs.channel }}/{{target}}/{{arch}}/{{current_version}}", "${UPDATE_SERVER_FALLBACK_URL}/desktop/${{ inputs.channel }}/{{target}}/{{arch}}/{{current_version}}", "https://github.com/${RELEASES_REPO}/releases/download/${{ inputs.release_tag }}/latest.json"] } }
          }
          EOF

      # $GITHUB_WORKSPACE keeps its backslashes when quoted; `${{ github.workspace }}` pasted into bash
      # loses them (D:aModuoModuo/...).
      - name: Build Windows NSIS installer
        run: |
          KEY="$(bash .ci/scripts/ci-normalize-updater-key.sh)"
          echo "::add-mask::$KEY"
          export TAURI_SIGNING_PRIVATE_KEY="$KEY"
          cd "$DESKTOP_DIR"
          bunx tauri build --bundles nsis --config "$GITHUB_WORKSPACE/ci-tauri-config.json"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.PUBLIC_STRIPE_PRICE_PRO_MONTHLY }}
          PUBLIC_STRIPE_PRICE_PRO_YEARLY: ${{ secrets.PUBLIC_STRIPE_PRICE_PRO_YEARLY }}
          PUBLIC_STRIPE_PRICE_TEAM_MONTHLY: ${{ secrets.PUBLIC_STRIPE_PRICE_TEAM_MONTHLY }}
          PUBLIC_STRIPE_PRICE_TEAM_YEARLY: ${{ secrets.PUBLIC_STRIPE_PRICE_TEAM_YEARLY }}
          PUBLIC_WEB_ORIGIN: ${{ inputs.web_origin }}
          PUBLIC_STAGING_PORTAL: ${{ inputs.staging_portal && 'true' || '' }}
          PUBLIC_DESKTOP_CHANNEL: ${{ inputs.desktop_channel }}

      # Git Bash's /tmp is not the path the upload action sees on Windows.
      - name: Stage artifacts
        run: |
          mkdir -p release-artifacts
          NSIS=$(find "$DESKTOP_DIR/src-tauri/target/release/bundle/nsis" -name "*-setup.exe" | head -1)
          cp "$NSIS" release-artifacts/Moduo_x64-setup.exe
          cp "$NSIS.sig" release-artifacts/Moduo_x64-setup.exe.sig

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          if-no-files-found: error
          path: release-artifacts/*

  # ─────────────────────────────────────────────────────────────────
  # Publish — update the rolling release. Needs a notarised Mac build; Windows is optional.
  # ─────────────────────────────────────────────────────────────────
  publish:
    needs: [version, build-mac, notarize-mac, build-windows]
    if: >-
      always() &&
      needs.build-mac.result == 'success' &&
      (needs.notarize-mac.result == 'success' || needs.notarize-mac.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only develop, main, mike, prod-app and v* tags may use this environment (REL-6 drops main and prod-app).
    environment: cloudflare-deploy
    outputs:
      published: ${{ steps.offered.outputs.published }}
    env:
      MODUO_VERSION: ${{ needs.version.outputs.version }}
      MODUO_BUILD: ${{ needs.version.outputs.build }}

    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci
          sparse-checkout: scripts

      # The manifest's notes come from the built commit's own notes (REL-2): production gets its
      # version's entry in release-notes/releases.json, staging the pending .changes as "Coming next".
      - name: Checkout the release notes of the built commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.build_sha }}
          path: .notes
          persist-credentials: false
          sparse-checkout: |
            scripts/release
            release-notes
            .changes

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # changes.ts is erasable TypeScript; Node 24 runs it without a build.
          node-version: 24

      - name: Render the update notes
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          out="$RUNNER_TEMP/notes.md"
          changes=.notes/scripts/release/changes.ts
          if [ ! -f "$changes" ]; then
            echo "::warning::The built commit has no release-notes pipeline; the update notes name the build only."
            echo "$CHANNEL build from commit $MODUO_BUILD" > "$out"
          elif [ "$CHANNEL" = production ]; then
            # Production ships VERSION as is, the releases.json key. A build without its entry
            # fails here: the release PR (/ship) writes it.
            node "$changes" notes "$MODUO_VERSION" > "$out"
          else
            node "$changes" coming-next > "$out"
          fi
          cat "$out"

      - name: Download Mac artifacts
        uses: actions/download-artifact@v8
        with:
          name: mac-dmg
          path: release-artifacts

      - name: Download Windows artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: windows-nsis
          path: release-artifacts

      # Manifests for the Tauri in-app updater: one per host, the same apart from the download URLs.
      # Without a fresh Windows build the Windows entry is left out (no update offered) rather than
      # pointing at an older installer under a newer version.
      - name: Generate latest.json
        id: manifests
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cd release-artifacts
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          manifest() {
            local base="$1" out="$2"
            jq -n \
              --arg version "$MODUO_VERSION" \
              --rawfile notes "$RUNNER_TEMP/notes.md" \
              --arg pub_date "$PUB_DATE" \
              --arg mac_sig "$(cat Moduo_universal.app.tar.gz.sig)" \
              --arg mac_url "$base/Moduo_universal.app.tar.gz" \
              '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {
                 "darwin-aarch64": {signature: $mac_sig, url: $mac_url},
                 "darwin-x86_64":  {signature: $mac_sig, url: $mac_url}}}' > "$out"
            if [ -f Moduo_x64-setup.exe.sig ]; then
              jq --arg sig "$(cat Moduo_x64-setup.exe.sig)" --arg url "$base/Moduo_x64-setup.exe" \
                '.platforms["windows-x86_64"] = {signature: $sig, url: $url}' "$out" > manifest.tmp && mv manifest.tmp "$out"
            fi
          }
          manifest "https://github.com/${RELEASES_REPO}/releases/download/$RELEASE_TAG" latest.json
          # Only a release with both platforms may become the bridge: a frozen manifest without
          # Windows would leave pre-PLAT-6 Windows installs on GitHub for good.
          if [ -f Moduo_x64-setup.exe.sig ]; then
            jq '.bridge = true' latest.json > manifest.tmp && mv manifest.tmp latest.json
          else
            echo "::warning::No Windows build, so this GitHub release is not the bridge yet; the next run with Windows becomes it."
          fi
          mkdir -p ../r2-manifest
          manifest "$UPDATE_SERVER_URL/download/desktop/$CHANNEL/$MODUO_VERSION" ../r2-manifest/latest.json
          if [ ! -f Moduo_x64-setup.exe.sig ]; then
            echo "::warning::No Windows build this run — the release keeps its previous Windows installer and the updater offers Windows nothing new."
          fi
          cat latest.json ../r2-manifest/latest.json

      # R2 first: every installer, bundle and .sig under the version's own folder, then that
      # version's manifest (which seals it: the version job refuses a version whose manifest
      # exists), then the channel's latest.json, the one key the update server reads to decide.
      # A re-run of this job after a partial upload writes the same files again. A re-run after
      # the seal (the pointer write or the check below failed) uploads nothing and only points
      # the channel at the sealed manifest; the version job kept any other run off this version.
      - name: Publish to R2 (update server)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHANNEL: ${{ inputs.channel }}
          WRANGLER: npx --yes wrangler@4.147.0
          BUCKET: moduo-releases
        run: |
          PREFIX="desktop/$CHANNEL/$MODUO_VERSION"
          put() { $WRANGLER r2 object put "$BUCKET/$1" --remote --file "$2" --content-type "$3" ${4:+--cache-control "$4"}; }
          # The channel pointer only moves forward: a re-run of an older run must not undo a newer one.
          point() {
            local cur
            cur="$(curl -sf "$UPDATE_SERVER_URL/desktop/$CHANNEL/latest.json" | jq -r '.version // empty' || true)"
            if [ -n "$cur" ] && [ "$cur" != "$MODUO_VERSION" ] && ! node "$GITHUB_WORKSPACE/.ci/scripts/release/version.mjs" assert-newer "$MODUO_VERSION" "$cur" >/dev/null 2>&1; then
              echo "::warning::The channel already points at $cur, newer than $MODUO_VERSION; leaving it."
              return 0
            fi
            put "desktop/$CHANNEL/latest.json" "$1" application/json no-store
          }
          curl -sSf "$UPDATE_SERVER_URL/health" >/dev/null || { echo "::error::The update server is not answering /health."; exit 1; }
          STATUS="$(curl -s -o sealed.json -w '%{http_code}' "$UPDATE_SERVER_URL/download/$PREFIX/latest.json")"
          case "$STATUS" in
            404)
              cd release-artifacts
              for f in Moduo_universal.dmg Moduo_universal.app.tar.gz Moduo_universal.app.tar.gz.sig Moduo_x64-setup.exe Moduo_x64-setup.exe.sig; do
                [ -f "$f" ] || continue
                put "$PREFIX/$f" "$f" application/octet-stream
              done
              put "$PREFIX/latest.json" ../r2-manifest/latest.json application/json
              point ../r2-manifest/latest.json
              ;;
            200)
              [ "$(jq -r '.version' sealed.json)" = "$MODUO_VERSION" ] || { echo "::error::$PREFIX/latest.json is not a $MODUO_VERSION manifest."; exit 1; }
              echo "::warning::$PREFIX is already sealed (a re-run); pointing the channel at it without uploading."
              point sealed.json
              ;;
            *) echo "::error::Could not tell whether $PREFIX is sealed (HTTP $STATUS). Re-run the job."; exit 1 ;;
          esac
          echo "Update server: \`$UPDATE_SERVER_URL/desktop/$CHANNEL/latest.json\` → \`$MODUO_VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the update server offers it
        id: offered
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          # Workers KV and R2 reads are immediate for new keys, but allow a short settle.
          for _ in 1 2 3 4 5 6; do
            got="$(curl -sf "$UPDATE_SERVER_URL/desktop/$CHANNEL/latest.json" | jq -r '.version // empty' || true)"
            [ "$got" = "$MODUO_VERSION" ] && break
            sleep 10
          done
          if [ "$got" != "$MODUO_VERSION" ]; then
            if [ -n "$got" ] && node .ci/scripts/release/version.mjs assert-newer "$got" "$MODUO_VERSION" >/dev/null 2>&1; then
              echo "::warning::The channel already serves the newer $got."
            else
              echo "::error::The update server answers ${got:-nothing}, not $MODUO_VERSION"; exit 1
            fi
          fi
          curl -sSf -o /dev/null -I "$UPDATE_SERVER_URL/download/desktop/$CHANNEL/$MODUO_VERSION/Moduo_universal.app.tar.gz"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$UPDATE_SERVER_URL/desktop/$CHANNEL/darwin/aarch64/0.0.1")
          echo "update check from 0.0.1 → $code (204 while the channel is paused or rolled out to 0%)"
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The bridge only (see the top of this file): builds before PLAT-6 only check GitHub. Runs
      # even when the R2 upload failed, so those installs still reach the bridge (the job stays red).
      - name: Upsert rolling ${{ inputs.release_tag }} GitHub Release (bridge)
        if: ${{ !cancelled() && steps.manifests.outcome == 'success' && needs.version.outputs.github_frozen != 'true' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          prerelease: ${{ inputs.prerelease }}
          body: |
            Rolling ${{ inputs.channel }} release.

            **Commit:** ${{ needs.version.outputs.build }}
            **Version:** ${{ env.MODUO_VERSION }}
            **Run:** ${{ github.run_id }}

            Download the desktop app or let the in-app updater install it automatically.
          files: |
            release-artifacts/Moduo_universal.dmg
            release-artifacts/Moduo_universal.app.tar.gz
            release-artifacts/Moduo_x64-setup.exe
            release-artifacts/latest.json
