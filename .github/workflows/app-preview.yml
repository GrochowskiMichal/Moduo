name: app-preview

# A preview of the web app for every PR (specs/platform-v2.md, PLAT-4, AC6): the PR's build is
# uploaded as a new version of the staging Worker (apps/app/wrangler.jsonc) with
# `wrangler versions upload`, which never changes what staging serves. The version gets a stable
# alias URL per PR, posted (and kept up to date) as one PR comment. It runs with staging's edge
# config, so it talks to the same Supabase project as staging. Sign-in is a typed code, so no
# redirect allowlist entry is needed for preview hosts.
#
# Each push merges the last 3 previews' hashed files of the same PR (lane pr-<n>,
# scripts/hosting/retain-static.sh), so an open preview tab keeps working across pushes, and the
# smoke test checks that.
#
# PRs from forks get no secrets and are skipped. Only PRs that can change the app's build run.
on:
  pull_request:
    branches: [develop, mike, maciej]
    paths:
      - apps/app/**
      - supabase/functions/_shared/**
      - scripts/smoke-hosting.ts
      - scripts/hosting/**
      - package.json
      - bun.lock
      - VERSION
      - .github/workflows/app-preview.yml

concurrency:
  group: app-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# bash with pipefail, so a failing wrangler before `| tee` fails the step.
defaults:
  run:
    shell: bash

env:
  WRANGLER: npx --yes wrangler@4.147.0
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CLOUDFLARE_API_TOKEN lives in this environment (a repo-level secret of the same name is the
    # fallback until it is moved; see docs/decisions/workflow.md, PLAT-4).
    environment: cloudflare-preview
    permissions:
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build the web app
        # No PUBLIC_* values at build time: the edge Worker injects each host's config.
        run: |
          MODUO_VERSION="$(cat VERSION)-rc"
          export MODUO_VERSION MODUO_BUILD="${SHA::7}"
          echo "build $MODUO_BUILD · version $MODUO_VERSION"
          bun run build:web

      - name: Keep this PR's earlier preview files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/hosting/retain-static.sh merge "pr-$PR" "${SHA::7}" apps/app/dist/web

      - name: Upload the preview version
        id: upload
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Never `wrangler deploy` here: a PR must not change what staging serves.
          $WRANGLER versions upload --env staging --preview-alias "pr-$PR" --var "BUILD:${SHA::7}" \
            --message "PR #$PR ${SHA::7}" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          alias=$(grep -i 'alias' "$RUNNER_TEMP/upload.log" | grep -oE 'https://[^ ]+\.workers\.dev' | head -1 || true)
          version=$(grep -i 'preview url' "$RUNNER_TEMP/upload.log" | grep -vi alias | grep -oE 'https://[^ ]+\.workers\.dev' | head -1 || true)
          [ -n "$alias$version" ] || { echo "::error::no preview URL in the wrangler output"; exit 1; }
          echo "url=${alias:-$version}" >> "$GITHUB_OUTPUT"
          echo "version_url=${version:-$alias}" >> "$GITHUB_OUTPUT"

      - name: Record this preview's files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/hosting/retain-static.sh record "pr-$PR" "${SHA::7}"

      - name: Smoke test
        id: smoke
        env:
          URL: ${{ steps.upload.outputs.version_url }}
        run: |
          old=()
          [ -s "$RUNNER_TEMP/web-builds/previous-static.txt" ] && old=(--old "$RUNNER_TEMP/web-builds/previous-static.txt")
          set +e
          bun scripts/smoke-hosting.ts "$URL" "${old[@]}" --expect stagingPortal=true --expect "build=${SHA::7}" > "$RUNNER_TEMP/smoke.md"
          code=$?
          set -e
          cat "$RUNNER_TEMP/smoke.md" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Comment the preview URL
        if: always() && steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
          VERSION_URL: ${{ steps.upload.outputs.version_url }}
          SMOKE: ${{ steps.smoke.outcome }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- app-preview -->'
          if [ "$SMOKE" = success ]; then smoke="✅ smoke test passed"; else smoke="❌ smoke test $SMOKE"; fi
          body=$(printf '%s\n**Web app preview** for %s: %s\n\nThis commit only: %s · %s ([run](%s))\n\nStaging config (same Supabase project as staging). Sign in with an emailed code.' \
            "$marker" "${SHA::7}" "$URL" "$VERSION_URL" "$smoke" "$RUN")
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          fi
