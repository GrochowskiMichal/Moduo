name: checks

# Lean mode (pre-alpha): the full suite runs on PRs into develop and on pushes to develop and
# the personal branches. Task branches get only the fast secret scan (secret-scan.yml). The push
# runs are what fill the remote cache: a personal-branch push writes it, so the later sync PR into
# develop restores almost everything. The develop push run also tests the merged commit, and
# the staging deploys (app-staging.yml, landing-deploy.yml) wait for it before staging gets that commit.
#
# Turborepo decides what actually runs: every task is hashed from its declared inputs and restored
# from the remote cache (infra/turbo-cache) when nothing it reads changed. `--affected` is
# deliberately not used: it only follows package.json dependencies, and the app reads
# supabase/functions/_shared and scripts/ through aliases, so a contracts change would skip the
# app's tests (docs/decisions/workflow.md, 2026-10-17 · PLAT-3).
#
# Cache access: pushes use the turbo-cache-write environment (write token; only develop, mike, maciej
# and v* tags may use it). Pull requests get the read-only token, which the Worker refuses
# for writes, plus TURBO_CACHE=local:rw,remote:r. The signing key is given to both, because turbo can't
# verify a signed artifact without it.
#
# `static-checks` is the one required context. It always runs and fails unless the secret scan
# passed and lint, every test shard and the ratchets passed (a new .only fails the weakening
# detector), or a docs-only PR skipped them.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, mike, maciej]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    env:
      EVENT: ${{ github.event_name }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      BEFORE: ${{ github.event.before }}
      SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks, this push or PR only)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSfLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_8.30.1_checksums.txt" | grep 'linux_x64.tar.gz' | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          if [ "$EVENT" = "pull_request" ]; then from="$PR_BASE"; to="$PR_HEAD"; else from="$BEFORE"; to="$SHA"; fi
          # new branch, or a force-push whose old tip is no longer reachable: scan just the tip commit
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then from="$to~1"; fi
          range="$from..$to"
          ./gitleaks git --log-opts="$range" --redact --no-banner --exit-code 1

      - name: Docs-only change?
        id: changes
        # Pull requests only: Markdown anywhere, and non-code files under docs/ and specs/, feed no
        # check, so a docs-only PR skips lint and tests. Push runs always run the suite: their
        # `before` may be a commit whose own run failed or was cancelled, and the cache makes an
        # unchanged suite cheap anyway.
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Assigned first, so a failing diff stops the step instead of reading as "no changes".
          files=$(git diff --name-only --no-renames "$PR_BASE...$PR_HEAD")
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              # Release notes are Markdown but published: the leak check (lint:notes) must run.
              .changes/*|release-notes/*|CHANGELOG.md) code=true ;;
              *.md) ;;
              docs/*|specs/*)
                case "$f" in
                  *.js|*.jsx|*.ts|*.tsx|*.mjs|*.cjs|*.mts|*.cts|*.json|*.jsonc) code=true ;;
                esac ;;
              *) code=true ;;
            esac
            [ "$code" = true ] && { echo "Code change: $f"; break; }
          done <<< "$files"
          [ "$code" = false ] && echo "Docs-only change: lint and tests are skipped."
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    needs: scan
    if: needs.scan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pushes only; an empty name means no environment, so a PR never sees the write token.
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || '' }}
    env: &turbo-env
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # No API URL set → no token either, so it can't go to turbo's default (Vercel) endpoint.
      TURBO_TOKEN: ${{ vars.TURBO_API != '' && (github.event_name == 'push' && secrets.TURBO_WRITE_TOKEN || secrets.TURBO_READ_TOKEN) || '' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_CACHE: ${{ github.event_name == 'push' && 'local:rw,remote:rw' || 'local:rw,remote:r' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Rstest, Stylelint and jsdom run on Node, not Bun: pin it, or the runner's own decides.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Remote cache mode
        run: echo "Remote cache ${TURBO_API:-not configured} · TURBO_CACHE=$TURBO_CACHE (remote:r = read-only)"

      - name: Typecheck, Biome, lint:tw, lint:boundaries, lint:css, release-notes leak check
        run: bunx turbo run typecheck typecheck:root lint:js lint:tw lint:boundaries lint:css lint:notes --output-logs=new-only

  unit-tests:
    needs: scan
    if: needs.scan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || '' }}
    env: *turbo-env
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: unit-tests (${{ matrix.shard }}/3)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Rstest, Stylelint and jsdom run on Node, not Bun: pin it, or the runner's own decides.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Remote cache mode
        run: echo "Remote cache ${TURBO_API:-not configured} · TURBO_CACHE=$TURBO_CACHE (remote:r = read-only)"

      - name: Unit tests (shard ${{ matrix.shard }} of 3)
        # Every package's suite (app, backend, scripts, turbo-cache) takes the same shard; each
        # shard is its own cache entry because turbo hashes the pass-through args.
        run: bunx turbo run test test:scripts --output-logs=new-only -- --shard ${{ matrix.shard }}/3

  # ── HV-5: ratchets and the test-weakening detector ──────────────────────────────────────
  # Size (32 KB) and per-function cognitive complexity (15), frozen at the 2026-10-23 values in
  # scripts/ci/ratchets.baseline.json: frozen code may shrink but not grow, anything new over a
  # limit fails. Part of static-checks.
  ratchets:
    needs: scan
    if: needs.scan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Size and complexity ratchets
        run: bun scripts/ci/ratchets.ts

  # Deleted assertions, new .skip/.only and new mocks in lib/sync tests (scripts/ci/test-weakening.ts).
  # Pull requests only: it reads the PR's diff. Findings are annotations for the merging founder;
  # only a new .only fails (it silently turns off the rest of its file). Part of static-checks.
  test-weakening:
    needs: scan
    if: github.event_name == 'pull_request' && needs.scan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Test-weakening detector
        run: bun scripts/ci/test-weakening.ts --range "$PR_BASE...$PR_HEAD"
  # ── end HV-5 ────────────────────────────────────────────────────────────────────────────

  static-checks:
    needs: [scan, lint, unit-tests, ratchets, test-weakening]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check passed
        env:
          SCAN: ${{ needs.scan.result }}
          CODE: ${{ needs.scan.outputs.code }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.unit-tests.result }}
          RATCHETS: ${{ needs.ratchets.result }}
          WEAKENING: ${{ needs.test-weakening.result }}
        run: |
          echo "scan: $SCAN · code change: $CODE · lint: $LINT · unit-tests: $TESTS"
          [ "$SCAN" = success ] || exit 1
          # HV-5: the ratchets run with lint; the weakening detector is skipped on pushes.
          echo "ratchets: $RATCHETS · test-weakening: $WEAKENING"
          if [ "$CODE" = true ]; then [ "$RATCHETS" = success ] || exit 1; fi
          case "$WEAKENING" in success|skipped) ;; *) exit 1 ;; esac
          if [ "$CODE" = true ]; then
            [ "$LINT" = success ] && [ "$TESTS" = success ]
          else
            [ "$LINT" = skipped ] && [ "$TESTS" = skipped ]
          fi
