name: checks

# Lean mode (pre-alpha): the full suite runs on PRs into develop and on pushes to develop and
# the personal branches. Task branches get only the fast secret scan (secret-scan.yml). The push
# runs are what fill the remote cache: a personal-branch push writes it, so the later sync PR into
# develop restores almost everything. The develop push run also tests the merged commit, and
# the staging deploys (app-staging.yml, landing-deploy.yml) wait for it before staging gets that commit.
#
# Turborepo decides what actually runs: every task is hashed from its declared inputs and restored
# from the remote cache (infra/turbo-cache) when nothing it reads changed. `--affected` is
# deliberately not used: it only follows package.json dependencies, and the app reads
# supabase/functions/_shared and scripts/ through aliases, so a contracts change would skip the
# app's tests (docs/decisions/workflow.md, 2026-10-17 · PLAT-3).
#
# Cache access: pushes use the turbo-cache-write environment (write token; only develop, mike, maciej
# and v* tags may use it). Pull requests get the read-only token, which the Worker refuses
# for writes, plus TURBO_CACHE=local:rw,remote:r. The signing key is given to both, because turbo can't
# verify a signed artifact without it.
#
# `static-checks` is the one required context. It always runs and fails unless the secret scan
# passed and lint and every test shard passed, or a docs-only PR skipped them, and each oracle
# (db-test, rust-check, e2e-smoke) passed or was skipped because none of its paths changed.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, mike, maciej]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    env:
      EVENT: ${{ github.event_name }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      BEFORE: ${{ github.event.before }}
      SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks, this push or PR only)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSfLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_8.30.1_checksums.txt" | grep 'linux_x64.tar.gz' | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          if [ "$EVENT" = "pull_request" ]; then from="$PR_BASE"; to="$PR_HEAD"; else from="$BEFORE"; to="$SHA"; fi
          # new branch, or a force-push whose old tip is no longer reachable: scan just the tip commit
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then from="$to~1"; fi
          range="$from..$to"
          ./gitleaks git --log-opts="$range" --redact --no-banner --exit-code 1

      - name: Docs-only change?
        id: changes
        # Pull requests only: Markdown anywhere, and non-code files under docs/ and specs/, feed no
        # check, so a docs-only PR skips lint and tests. Push runs always run the suite: their
        # `before` may be a commit whose own run failed or was cancelled, and the cache makes an
        # unchanged suite cheap anyway.
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Assigned first, so a failing diff stops the step instead of reading as "no changes".
          files=$(git diff --name-only --no-renames "$PR_BASE...$PR_HEAD")
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              # Release notes are Markdown but published: the leak check (lint:notes) must run.
              .changes/*|release-notes/*|CHANGELOG.md) code=true ;;
              *.md) ;;
              docs/*|specs/*)
                case "$f" in
                  *.js|*.jsx|*.ts|*.tsx|*.mjs|*.cjs|*.mts|*.cts|*.json|*.jsonc) code=true ;;
                esac ;;
              *) code=true ;;
            esac
            [ "$code" = true ] && { echo "Code change: $f"; break; }
          done <<< "$files"
          [ "$code" = false ] && echo "Docs-only change: lint and tests are skipped."
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    needs: scan
    if: needs.scan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pushes only; an empty name means no environment, so a PR never sees the write token.
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || '' }}
    env: &turbo-env
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # No API URL set → no token either, so it can't go to turbo's default (Vercel) endpoint.
      TURBO_TOKEN: ${{ vars.TURBO_API != '' && (github.event_name == 'push' && secrets.TURBO_WRITE_TOKEN || secrets.TURBO_READ_TOKEN) || '' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_CACHE: ${{ github.event_name == 'push' && 'local:rw,remote:rw' || 'local:rw,remote:r' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Rstest, Stylelint and jsdom run on Node, not Bun: pin it, or the runner's own decides.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Remote cache mode
        run: echo "Remote cache ${TURBO_API:-not configured} · TURBO_CACHE=$TURBO_CACHE (remote:r = read-only)"

      - name: Typecheck, Biome, lint:tw, lint:boundaries, lint:css, release-notes leak check
        run: bunx turbo run typecheck typecheck:root lint:js lint:tw lint:boundaries lint:css lint:notes --output-logs=new-only

  unit-tests:
    needs: scan
    if: needs.scan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'push' && 'turbo-cache-write' || '' }}
    env: *turbo-env
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: unit-tests (${{ matrix.shard }}/3)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Rstest, Stylelint and jsdom run on Node, not Bun: pin it, or the runner's own decides.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Remote cache mode
        run: echo "Remote cache ${TURBO_API:-not configured} · TURBO_CACHE=$TURBO_CACHE (remote:r = read-only)"

      - name: Unit tests (shard ${{ matrix.shard }} of 3)
        # Every package's suite (app, backend, scripts, turbo-cache) takes the same shard; each
        # shard is its own cache entry because turbo hashes the pass-through args.
        run: bunx turbo run test test:scripts --output-logs=new-only -- --shard ${{ matrix.shard }}/3

  # ── Oracles (HV-4): the suites `bun run verify` doesn't run. Each runs only when a file it
  # reads changed (oracle-paths decides), so most PRs skip them; static-checks counts a skip as
  # a pass. A PR diffs against its base; a push against the previous tip, and a push that changed
  # this file runs all three, so a change to these jobs is proved once it lands on mike/develop.
  oracle-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      db: ${{ steps.paths.outputs.db }}
      rust: ${{ steps.paths.outputs.rust }}
      e2e: ${{ steps.paths.outputs.e2e }}
    env:
      EVENT: ${{ github.event_name }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      BEFORE: ${{ github.event.before }}
      SHA: ${{ github.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Which oracles does this change need?
        id: paths
        run: |
          db=false rust=false e2e=false
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only --no-renames "$PR_BASE...$PR_HEAD")
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --no-renames "$BEFORE" "$SHA")
          else
            # A new branch, or a force-push whose old tip is gone: nothing to diff against.
            echo "No previous tip to diff against: every oracle runs."
            files=.github/workflows/checks.yml
          fi
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              # Edge Functions have their own unit tests; the SQL tests read the schema only.
              *.md|supabase/functions/*) ;;
              supabase/*|scripts/db-test.ts|scripts/local/stack.sh) db=true ;;
            esac
            case "$f" in
              apps/desktop/src-tauri/*) rust=true ;;
            esac
            case "$f" in
              # The web app, what it imports through aliases, and the toolchain it builds with.
              apps/app/*|e2e/*|supabase/functions/_shared/*|scripts/agent/e2e-env.ts|package.json|bun.lock|.nvmrc|.bun-version) e2e=true ;;
            esac
            if [ "$f" = .github/workflows/checks.yml ] && [ "$EVENT" != "pull_request" ]; then
              db=true rust=true e2e=true
            fi
          done <<< "$files"
          # A fork's code must never see prod's schema snapshot (the cache is readable by any
          # run here, and a fork could print it to the public log): its SQL tests run after merge.
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" != "$REPO" ] && [ "$db" = true ]; then
            echo "Pull request from a fork: db-test is skipped here and runs on the push after merge."
            db=false
          fi
          echo "db-test: $db · rust-check: $rust · e2e-smoke: $e2e"
          { echo "db=$db"; echo "rust=$rust"; echo "e2e=$e2e"; } >> "$GITHUB_OUTPUT"

  # The SQL/RLS tests (supabase/tests, `bun run db:test`) on a throwaway Supabase stack in the
  # runner, built like `bun run local:reset`: prod's schema snapshot, then the repo migrations
  # prod hasn't applied. The snapshot comes from the db-snapshot workflow through the Actions
  # cache (never an artifact: the repo is public), so a fork's pull request skips it.
  # supabase/tests/known-failures.txt holds what is already red; anything else fails the job.
  db-test:
    needs: oracle-paths
    if: needs.oracle-paths.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore prod's schema snapshot
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/moduo/supabase-snapshot
          # Never an exact hit: restore-keys takes the newest snapshot.
          key: db-snapshot-${{ github.run_id }}
          restore-keys: db-snapshot-

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Start the stack and build the database
        run: bash scripts/local/stack.sh ci

      - name: SQL tests
        run: bun run db:test

  # `bun run verify` covers no Rust (apps/desktop/src-tauri/AGENTS.md): the three Rust gates.
  rust-check:
    needs: oracle-paths
    if: needs.oracle-paths.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Linux build deps for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Read Rust toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      # Saved by push runs only: a PR's cache is scoped to that PR and would just crowd the quota.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: rust-check-linux
          save-if: ${{ github.event_name == 'push' }}

      # tauri-build refuses to compile without frontendDist (../../app/dist); an empty page will do.
      - name: Stub the frontend dist
        run: mkdir -p ../../app/dist && echo '<!doctype html>' > ../../app/dist/index.html

      - name: cargo check
        run: cargo check --locked

      - name: cargo check --features lite
        run: cargo check --locked --features lite

      - name: cargo test --lib
        run: cargo test --locked --lib

  # The web app boots and its signed-out pages render (e2e/smoke, `bun run e2e:smoke`). Supabase
  # points at a port nothing listens on, so the run never reaches prod. The signed-in suites need
  # the local stack and stay `bun run e2e`.
  e2e-smoke:
    needs: oracle-paths
    if: needs.oracle-paths.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e_smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps --only-shell chromium

      - name: E2E smoke
        run: bun run e2e:smoke

      - name: Upload the Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-results
          path: e2e/test-results/
          retention-days: 7

  static-checks:
    needs: [scan, lint, unit-tests, oracle-paths, db-test, rust-check, e2e-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check passed
        env:
          SCAN: ${{ needs.scan.result }}
          CODE: ${{ needs.scan.outputs.code }}
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.unit-tests.result }}
          PATHS: ${{ needs.oracle-paths.result }}
          ORACLES: >-
            db-test ${{ needs.oracle-paths.outputs.db }} ${{ needs.db-test.result }}
            rust-check ${{ needs.oracle-paths.outputs.rust }} ${{ needs.rust-check.result }}
            e2e-smoke ${{ needs.oracle-paths.outputs.e2e }} ${{ needs.e2e-smoke.result }}
        run: |
          echo "scan: $SCAN · code change: $CODE · lint: $LINT · unit-tests: $TESTS"
          [ "$SCAN" = success ] || exit 1
          if [ "$CODE" = true ]; then
            [ "$LINT" = success ] && [ "$TESTS" = success ] || exit 1
          else
            [ "$LINT" = skipped ] && [ "$TESTS" = skipped ] || exit 1
          fi
          # Oracles: success when its paths changed, skipped when they didn't.
          echo "oracle-paths: $PATHS"
          [ "$PATHS" = success ] || exit 1
          ok=true
          # shellcheck disable=SC2086 # split into name, paths-changed, result triples
          set -- $ORACLES
          while [ $# -ge 3 ]; do
            if [ "$2" = true ]; then want=success; else want=skipped; fi
            echo "$1: paths changed $2 · result $3 (needs $want)"
            [ "$3" = "$want" ] || ok=false
            shift 3
          done
          [ "$ok" = true ]
