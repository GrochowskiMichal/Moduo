name: checks

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - maciej
      - mike
      - "t/maciej/**"
      - "t/mike/**"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks, this push or PR only)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSfLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_8.30.1_checksums.txt" | grep 'linux_x64.tar.gz' | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          if [ "$EVENT" = "pull_request" ]; then from="$PR_BASE"; to="$PR_HEAD"; else from="$BEFORE"; to="$SHA"; fi
          # new branch, or a force-push whose old tip is no longer reachable: scan just the tip commit
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then from="$to~1"; fi
          range="$from..$to"
          ./gitleaks git --log-opts="$range" --redact --no-banner --exit-code 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Biome (JS/TS lint + format)
        run: bun run lint:js

      - name: Tailwind arbitrary-value gate
        run: bun run lint:tw

      - name: CSS lint
        run: bun run lint:css

      - name: Unit tests
        run: bun run test

  # Unauthenticated smoke of the web app (paywall, auth, redirect). The authed suites need a
  # seeded test Supabase project and stay manual: `bun run e2e` (see docs/gotchas/build-ci.md).
  e2e-smoke:
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps --only-shell chromium

      - name: E2E smoke
        run: bun run e2e:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-results
          path: test-results/
          retention-days: 7
