name: checks

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - maciej
      - mike
      - "t/maciej/**"
      - "t/mike/**"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tailwind arbitrary-value gate
        run: bun run lint:tw

      - name: CSS lint
        run: bun run lint:css
