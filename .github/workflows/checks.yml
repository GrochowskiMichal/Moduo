name: checks

# Lean mode (pre-alpha): the full suite runs once, on PRs into develop/main and on pushes to them.
# Other branches get only the fast secret scan (secret-scan.yml). The push run on develop is kept on
# purpose: it tests the merged commit (the PR run tested the PR head), and sync-staging-app.yml
# waits for it before staging gets that commit.
#
# `static-checks` is the one required context. It is an aggregate that always runs and fails unless
# `lint` and every unit-test shard passed, so a skipped or cancelled job can't satisfy it.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks, this push or PR only)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSfLO "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_8.30.1_checksums.txt" | grep 'linux_x64.tar.gz' | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          if [ "$EVENT" = "pull_request" ]; then from="$PR_BASE"; to="$PR_HEAD"; else from="$BEFORE"; to="$SHA"; fi
          # new branch, or a force-push whose old tip is no longer reachable: scan just the tip commit
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then from="$to~1"; fi
          range="$from..$to"
          ./gitleaks git --log-opts="$range" --redact --no-banner --exit-code 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Biome (JS/TS lint + format)
        run: bun run lint:js

      - name: Tailwind arbitrary-value gate
        run: bun run lint:tw

      - name: CSS lint
        run: bun run lint:css

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: unit-tests (${{ matrix.shard }}/3)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Unit tests (shard ${{ matrix.shard }} of 3)
        run: bun run test --shard ${{ matrix.shard }}/3

  static-checks:
    needs: [lint, unit-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check passed
        env:
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.unit-tests.result }}
        run: |
          echo "lint: $LINT · unit-tests: $TESTS"
          [ "$LINT" = success ] && [ "$TESTS" = success ]
