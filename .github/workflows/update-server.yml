name: update-server

# Deploys the desktop update server (infra/update-server: a Worker that answers the Tauri updater
# and serves installers from the R2 bucket moduo-releases). Runs when the Worker changes on develop
# or mike, or by hand. The bucket and the KV namespace that holds rollout and kill-switch settings
# are created on first run. Rollout changes go through desktop-rollout.yml, never a redeploy.
on:
  push:
    branches: [develop, mike]
    paths:
      - infra/update-server/**
      - .github/workflows/update-server.yml
  workflow_dispatch:

concurrency:
  group: update-server-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER: npx --yes wrangler@4.147.0
      BUCKET: moduo-releases
      KV_TITLE: moduo-update-config
      UPDATE_SERVER_URL: ${{ vars.UPDATE_SERVER_URL || 'https://moduo-update-server.moduo.workers.dev' }}
    defaults:
      run:
        working-directory: infra/update-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Test the Worker
        run: |
          bun install --frozen-lockfile
          bun run test

      # The Cloudflare token is given only to the wrangler steps, never to install or tests.
      - name: Bucket and KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! $WRANGLER r2 bucket info "$BUCKET" >/dev/null 2>&1; then
            $WRANGLER r2 bucket create "$BUCKET"
          fi
          find_ns() { $WRANGLER kv namespace list | jq -r --arg t "$KV_TITLE" '.[] | select(.title == $t) | .id'; }
          ID="$(find_ns)"
          if [ -z "$ID" ]; then
            $WRANGLER kv namespace create "$KV_TITLE"
            ID="$(find_ns)"
          fi
          [ -n "$ID" ] || { echo "::error::Could not find or create the KV namespace $KV_TITLE"; exit 1; }
          sed -i "s/\"KV_NAMESPACE_ID\"/\"$ID\"/" wrangler.jsonc
          grep -q "\"$ID\"" wrangler.jsonc

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: $WRANGLER deploy

      - name: Smoke test
        run: |
          curl -sSf "$UPDATE_SERVER_URL/health"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$UPDATE_SERVER_URL/desktop/staging/darwin/aarch64/0.0.1")
          echo "update check → $code"
          case "$code" in 200|204) ;; *) exit 1 ;; esac
