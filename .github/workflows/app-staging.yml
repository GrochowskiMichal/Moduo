name: app-staging

# Deploys the web app to the staging Worker (apps/app/wrangler.jsonc, env staging) after `checks`
# passes on a develop push, for exactly the commit checks tested (specs/platform-v2.md, PLAT-4,
# AC6). Each deploy also uploads the hashed files of the previous 3 staging builds (lane
# "staging", scripts/hosting/retain-static.sh), so a tab opened before the deploy keeps loading
# its chunks (AC8). A smoke test runs against the live Worker afterwards.
#
# Staging is https://app.staging.moduo.app (a custom domain in apps/app/wrangler.jsonc); the smoke
# test runs there. Production gets a commit from here through a release tag (release.yml). Roll back from the
# Cloudflare dashboard or `wrangler rollback --env staging`.
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [develop]

# Two develop pushes close together: the later deploy waits; each deploys its own tested commit.
concurrency:
  group: app-staging
  cancel-in-progress: false

permissions:
  contents: read

# bash with pipefail, so a failing wrangler before `| tee` fails the step.
defaults:
  run:
    shell: bash

env:
  WRANGLER: npx --yes wrangler@4.147.0

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only develop, mike and v* tags may use this environment, which holds CLOUDFLARE_API_TOKEN (a
    # repo-level secret of the same name is the fallback until it is moved).
    environment: cloudflare-deploy
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build the web app
        # No PUBLIC_* values at build time: the edge Worker injects each host's config.
        run: |
          MODUO_VERSION="$(cat VERSION)-rc"
          export MODUO_VERSION MODUO_BUILD="${SHA::7}"
          echo "build $MODUO_BUILD · version $MODUO_VERSION"
          bun run build:web

      - name: Keep the previous 3 builds' files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/hosting/retain-static.sh merge staging "${SHA::7}" apps/app/dist/web

      - name: Deploy
        working-directory: apps/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $WRANGLER deploy --env staging --var "BUILD:${SHA::7}" --message "develop ${SHA::7}"

      - name: Record this build's files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/hosting/retain-static.sh record staging "${SHA::7}"

      - name: Smoke test
        env:
          URL: https://app.staging.moduo.app
        run: |
          old=()
          [ -s "$RUNNER_TEMP/web-builds/previous-static.txt" ] && old=(--old "$RUNNER_TEMP/web-builds/previous-static.txt")
          set +e
          bun scripts/smoke-hosting.ts "$URL" "${old[@]}" --expect stagingPortal=true --expect "build=${SHA::7}" > "$RUNNER_TEMP/smoke.md"
          code=$?
          set -e
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/smoke.md"
          exit $code
