[package]
name = "moduo-ui"
description = "Moduo's primitives. The only crate that may name the component library."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-support = ["gpui-kit/test-support"]

[dependencies]
gpui-kit = { workspace = true }
moduo-tokens = { path = "../tokens" }

[dev-dependencies]
# The test harness, also when this crate's tests run alone (`cargo test -p moduo-ui`).
gpui-kit = { workspace = true, features = ["test-support"] }
ttf-parser = "0.25"
