[package]
name = "moduo"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
default-run = "moduo"

[lib]
name = "moduo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Offline/"lite" build seed: compiles the redb↔Supabase cloud-sync worker
# (superseded by the JS `notesV2` engine on the default cloud build). Off by default.
lite = []

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
active-win-pos-rs = "0.11"
aes-gcm = "0.11"
anyhow = "1"
argon2 = "0.6"
base64 = "0.23"
bip39 = { version = "3", features = ["rand"] }
ed25519-dalek = "3"
chrono = { version = "0.4", features = ["serde"] }
fastrand = "2"
# Async IMAP on tokio. The sync email engine drives it through the facade in
# src/commands/email/connection.rs. Replaced the unmaintained `imap` 2.x crate.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
lettre = "0.11"
mailparse = "0.18"
native-tls = "0.2"
# Per-read/per-write socket timeouts for the async IMAP stream (the old std
# TcpStream set_read_timeout semantics).
tokio-io-timeout = "1"
tokio-native-tls = "0.3"
rand = "0.10"
# 4.x cannot open a 2.x database file. Desktop stores (mail, identity) stay on 2.x.
redb = "2.6"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
socket2 = "0.6"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls", "http2"] }
url = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
webbrowser = "1"
# v4's default `v1` feature picks the native store per OS. The old
# apple-native / windows-native / linux-native feature names are gone.
keyring = "4"

[dev-dependencies]
# Stream collection in the live IMAP harness (tests/imap_live.rs).
futures-util = "0.3"

# Release builds trade build time for a smaller, faster binary (Tauri's size guide). Unwinding stays
# on (no panic = "abort"): a panicking tokio task must not take the whole app down. Nothing reads
# symbols from a shipped binary (no crash reporter), so stripping them is free.
[profile.release]
lto = true
codegen-units = 1
strip = true
