[package]
name = "moduo-gpui-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone on purpose: not part of any Cargo or Bun workspace, never shipped.
[workspace]

[dependencies]
gpui-kit = "0.11.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
jiff = "1"
keyring = { version = "3", features = ["apple-native"] }
